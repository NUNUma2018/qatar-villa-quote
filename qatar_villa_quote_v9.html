<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Qatar Quote"/>
<meta name="theme-color" content="#0D1F35"/>
<title>◈ Qatar Villa Quote v8</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy: #0D1F35;
  --navy2: #1A3A5C;
  --gold: #B88600;
  --gold2: #D4A017;
  --green: #2E6B4F;
  --cream: #E8EDF2;
  --muted: rgba(232,237,242,0.5);
  --dim: rgba(232,237,242,0.2);
  --glass: rgba(255,255,255,0.05);
  --glass2: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.09);
  --radius: 14px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { overflow-x: hidden; }
body { font-family: var(--font-body); background: var(--navy); color: var(--cream); min-height: 100vh; min-height: 100dvh; }

.bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 50% at 15% 15%, rgba(26,58,92,0.7) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 85%, rgba(184,134,0,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(46,107,79,0.08) 0%, transparent 70%); }
.bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px; }

/* ── Header ── */
header { position: sticky; top: 0; z-index: 200; background: rgba(13,31,53,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(184,134,0,0.25); padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-gem { font-size: 20px; color: var(--gold); }
.logo-text { line-height: 1.2; }
.logo-title { font-family: var(--font-display); font-size: 12px; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; }
.logo-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.5px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Language toggle */
.lang-toggle {
  display: flex; border: 1px solid rgba(184,134,0,0.4); border-radius: 20px; overflow: hidden; flex-shrink: 0;
}
.lang-btn {
  padding: 4px 10px; font-size: 10px; font-weight: 700; cursor: pointer; border: none;
  background: transparent; color: var(--muted); font-family: var(--font-body); transition: all 0.2s; letter-spacing: 0.5px;
}
.lang-btn.active { background: var(--gold); color: #000; }

.save-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px;
  background: rgba(46,107,79,0.25); border: 1px solid rgba(46,107,79,0.5); color: #7EC8A0; }

/* Sync menu button */
.sync-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(184,134,0,0.4);
  background: rgba(184,134,0,0.1); color: var(--gold); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sync-btn:active { background: rgba(184,134,0,0.25); }

/* Sync modal */
.sync-modal-overlay {
  position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.sync-modal-overlay.show { display: flex; }
.sync-modal {
  background: linear-gradient(180deg, var(--navy2), var(--navy));
  border: 1px solid rgba(184,134,0,0.4); border-radius: 16px;
  width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}
.sync-modal-head {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.sync-modal-title { font-family: var(--font-display); font-size: 18px; color: var(--gold); font-weight: 700; }
.sync-close {
  width: 28px; height: 28px; border-radius: 50%; background: var(--glass2);
  border: 1px solid var(--border); color: var(--cream); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.sync-modal-body { padding: 14px 20px 20px; }
.sync-section { margin-bottom: 16px; }
.sync-section:last-child { margin-bottom: 0; }
.sync-section-title { font-size: 11px; color: var(--gold); letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
.sync-section-desc { font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.sync-action-btn {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--glass); color: var(--cream); font-family: var(--font-body); font-size: 13px;
  cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  transition: all 0.18s; text-align: left;
}
.sync-action-btn:hover, .sync-action-btn:active {
  border-color: var(--gold); background: rgba(184,134,0,0.12); color: var(--gold);
}
.sync-action-icon { font-size: 18px; flex-shrink: 0; }
.sync-action-text { flex: 1; }
.sync-action-name { font-size: 13px; font-weight: 600; }
.sync-action-sub { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.sync-file-input { display: none; }
.share-url-box {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 10px; color: var(--cream); word-break: break-all;
  font-family: monospace; margin-top: 6px; max-height: 80px; overflow-y: auto;
}
.copy-feedback { font-size: 10px; color: #7EC8A0; margin-top: 4px; display: none; }
.copy-feedback.show { display: block; }

/* ── Nav ── */
.tab-nav { position: sticky; top: 56px; z-index: 190; background: rgba(13,31,53,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; scrollbar-width: none; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { flex: 1; min-width: 76px; padding: 8px 6px; background: none; border: none; cursor: pointer;
  color: var(--muted); font-family: var(--font-body); font-size: 10px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-btn .tab-icon { font-size: 15px; }
.tab-label-zh { display: block; }
.tab-label-en { display: block; font-size: 9px; opacity: 0.6; letter-spacing: 0.3px; }
.tab-num { width: 16px; height: 16px; border-radius: 50%; background: var(--navy2); border: 1px solid var(--border);
  font-size: 9px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.tab-btn.active .tab-num { background: var(--gold); border-color: var(--gold); color: #000; }
.tab-btn.done .tab-num { background: var(--green); border-color: var(--green); color: #fff; }

/* ── Main ── */
main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 24px 16px 130px; }
.page { animation: fadeSlide 0.25s ease; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.sec-head { margin-bottom: 20px; }
.sec-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; border-left: 3px solid var(--gold); padding-left: 12px; }
.sec-sub { font-size: 11px; color: var(--muted); margin-top: 4px; padding-left: 15px; }

/* ── Cards ── */
.card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.card-head { padding: 12px 18px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; gap: 8px; }

/* ── Style selector ── */
.style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.style-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 16px 12px; cursor: pointer;
  text-align: left; background: var(--glass); transition: all 0.22s; position: relative; overflow: hidden; }
.style-card:active { transform: scale(0.97); }
.style-card.selected { transform: translateY(-2px); }
.style-bar { width: 28px; height: 3px; border-radius: 2px; margin-bottom: 10px; }
.style-name { font-size: 13px; font-weight: 700; margin-bottom: 1px; }
.style-en { font-size: 9px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; }
.style-desc-zh { font-size: 10px; color: var(--muted); line-height: 1.5; margin-bottom: 2px; }
.style-desc-en { font-size: 9px; color: rgba(232,237,242,0.35); line-height: 1.5; margin-bottom: 8px; }
.style-mult { font-size: 11px; font-weight: 700; }
.check-badge { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 700; }

/* ── Tier ── */
.tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tier-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 18px 12px; cursor: pointer;
  text-align: center; background: var(--glass); transition: all 0.22s; position: relative; }
.tier-card:active { transform: scale(0.97); }
.tier-card.selected { transform: scale(1.03); }
.tier-icon { font-size: 26px; margin-bottom: 8px; }
.tier-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.tier-name-en { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.tier-note-zh { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
.tier-note-en { font-size: 9px; color: rgba(232,237,242,0.3); margin-bottom: 8px; }
.tier-mult { font-size: 18px; font-weight: 800; }
.rec-badge { margin-top: 8px; font-size: 9px; padding: 3px 8px; border-radius: 20px; display: inline-block; }
@media (max-width: 480px) {
  .tier-grid { grid-template-columns: 1fr; }
  .tier-card { display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px; }
  .tier-icon { font-size: 22px; margin: 0; flex-shrink: 0; }
}

/* ── Info boxes ── */
.info-box { background: rgba(184,134,0,0.1); border: 1px solid rgba(184,134,0,0.3); border-radius: 10px;
  padding: 12px 14px; font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.6; margin-bottom: 18px; }
.warn-box { background: rgba(180,60,60,0.1); border: 1px solid rgba(180,60,60,0.3); border-radius: 10px;
  padding: 12px 14px; font-size: 12px; color: rgba(255,180,180,0.85); line-height: 1.6; margin-bottom: 18px; }

/* ── Space list ── */
.space-list { display: flex; flex-direction: column; gap: 8px; }
.space-row { display: flex; align-items: center; gap: 8px; background: var(--glass2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; transition: border-color 0.2s; flex-wrap: wrap; }
.space-row.has-value { border-color: rgba(184,134,0,0.35); }
.space-icon { font-size: 18px; width: 26px; text-align: center; flex-shrink: 0; }
.space-info { flex: 1; min-width: 90px; }
.space-name { font-size: 12px; font-weight: 600; }
.space-name-en { font-size: 9px; color: rgba(232,237,242,0.4); margin-top: 1px; }
.space-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

.space-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: nowrap; }
.space-input { width: 64px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 8px; color: var(--cream); font-size: 14px; font-weight: 700; padding: 6px 6px;
  text-align: center; outline: none; font-family: var(--font-body); transition: border-color 0.2s; }
.space-input:focus { border-color: var(--gold); }
.space-unit { font-size: 11px; color: var(--muted); }

/* Base price edit */
.base-price-wrap { display: flex; align-items: center; gap: 3px; }
.base-price-input { width: 56px; background: rgba(184,134,0,0.1); border: 1px solid rgba(184,134,0,0.3);
  border-radius: 6px; color: var(--gold); font-size: 10px; font-weight: 700; padding: 3px 5px;
  text-align: center; outline: none; font-family: var(--font-body); transition: border-color 0.2s; }
.base-price-input:focus { border-color: var(--gold); background: rgba(184,134,0,0.2); }
.base-price-label { font-size: 9px; color: rgba(184,134,0,0.6); white-space: nowrap; }

.space-cost { font-size: 11px; color: var(--gold); font-weight: 700; min-width: 88px; text-align: right; flex-shrink: 0; }
.space-del { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,80,80,0.3);
  background: rgba(255,80,80,0.1); color: rgba(255,150,150,0.8); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: all 0.2s; }
.space-del:hover { background: rgba(255,80,80,0.25); }

/* Area quick buttons */
.area-quick { display: flex; gap: 3px; flex-shrink: 0; }
.area-quick-btn { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--glass); color: var(--cream); cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; font-weight: 700; }
.area-quick-btn:active { background: rgba(184,134,0,0.2); }

/* ── Add spaces ── */
.add-section { margin-top: 20px; }
.add-section-title { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
.add-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.add-btn { background: var(--glass); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; color: var(--muted); font-size: 11px; font-family: var(--font-body);
  transition: all 0.18s; white-space: nowrap; }
.add-btn:hover, .add-btn:active { background: var(--glass2); border-color: var(--gold); color: var(--gold); }
.custom-add { display: flex; gap: 8px; margin-top: 12px; }
.custom-input { flex: 1; background: var(--glass); border: 1px solid var(--border); border-radius: 8px;
  color: var(--cream); font-size: 12px; padding: 8px 12px; outline: none; font-family: var(--font-body); }
.custom-input:focus { border-color: var(--gold); }
.custom-confirm { background: var(--gold); border: none; border-radius: 8px; padding: 8px 16px; color: #000; font-weight: 700; cursor: pointer; font-size: 12px; }

.area-summary { margin-top: 14px; padding: 12px 16px; background: rgba(184,134,0,0.08);
  border: 1px solid rgba(184,134,0,0.2); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
.area-label { font-size: 12px; color: var(--muted); }
.area-val { font-size: 16px; font-weight: 800; color: var(--gold); }

/* ── Quote ── */
.client-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.client-field { flex: 1; min-width: 180px; }
.client-label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 4px; letter-spacing: 0.5px; }
.client-input { width: 100%; background: var(--glass2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--cream); font-size: 13px; padding: 9px 12px; outline: none; font-family: var(--font-body); }
.client-input:focus { border-color: var(--gold); }

.quote-card { background: var(--glass); border: 1px solid rgba(184,134,0,0.3); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.quote-header-band { background: linear-gradient(90deg, var(--navy2), #0a1826); padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
.quote-htitle { font-family: var(--font-display); font-size: 18px; color: var(--gold); font-weight: 700; }
.quote-hmeta { font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.7; }
.quote-hdate { font-size: 11px; color: var(--muted); text-align: right; }

.price-band { padding: 24px 20px; text-align: center; background: linear-gradient(135deg, rgba(26,58,92,0.5), rgba(184,134,0,0.08)); border-bottom: 1px solid var(--border); }
.price-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.price-range { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.price-low { font-size: 20px; font-weight: 300; color: rgba(232,237,242,0.7); }
.price-sep { font-size: 18px; color: var(--gold); }
.price-high { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--gold); }
.price-note { margin-top: 10px; font-size: 11px; color: rgba(255,184,0,0.65); }
.price-sqm { margin-top: 4px; font-size: 11px; color: var(--muted); }

/* Manual price override in quote */
.manual-override { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 16px;
  background: rgba(255,255,255,0.04); border-radius: 10px; flex-wrap: wrap; justify-content: center; }
.manual-override-label { font-size: 11px; color: var(--muted); }
.manual-discount { display: flex; gap: 6px; flex-wrap: wrap; }
.disc-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--glass);
  color: var(--muted); font-size: 10px; cursor: pointer; font-family: var(--font-body); transition: all 0.18s; }
.disc-btn.active { background: rgba(46,107,79,0.25); border-color: rgba(46,107,79,0.5); color: #7EC8A0; font-weight: 700; }
.disc-btn.disc-neg { }
.disc-btn.disc-neg.active { background: rgba(180,60,60,0.2); border-color: rgba(180,60,60,0.4); color: rgba(255,150,150,0.9); }

.breakdown-wrap { padding: 16px 20px; }
.breakdown-title { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.b-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
.b-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.b-label { font-size: 11px; color: rgba(232,237,242,0.65); flex: 1; min-width: 140px; }
.b-bar { flex: 2; height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; min-width: 60px; overflow: hidden; }
.b-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
.b-pct { font-size: 10px; color: var(--muted); width: 30px; text-align: right; }
.b-val { font-size: 11px; font-weight: 700; color: var(--cream); min-width: 100px; text-align: right; }
.b-total { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; font-size: 13px; font-weight: 700; }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 480px; }
th { background: rgba(26,58,92,0.7); color: var(--muted); padding: 8px 10px; text-align: left; font-weight: 600;
  border-bottom: 2px solid rgba(184,134,0,0.3); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--cream); }
tr:last-child td { border-bottom: none; }

/* ── Payment ── */
.pay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.pay-card { background: var(--glass); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.pay-head { padding: 6px 12px; font-size: 11px; font-weight: 700; color: #fff; }
.pay-amount { padding: 10px 12px 2px; font-size: 15px; font-weight: 800; color: var(--gold); }
.pay-pct { font-size: 11px; color: var(--muted); font-weight: 400; }
.pay-trigger { padding: 0 12px 2px; font-size: 10px; color: var(--muted); }
.pay-trigger-en { padding: 0 12px 3px; font-size: 9px; color: rgba(232,237,242,0.25); }
.pay-products { padding: 0 12px 10px; font-size: 10px; color: rgba(255,255,255,0.35); }

.disc { padding: 8px 12px; margin-bottom: 7px; font-size: 11px; color: rgba(255,255,255,0.5);
  line-height: 1.65; background: rgba(255,255,255,0.03); border-radius: 0 6px 6px 0; }

/* ── Bottom bar ── */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: rgba(13,31,53,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(184,134,0,0.25);
  padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: space-between; }

/* ═══════════════════════════════════════════════════════════════════════════
   ARABIC TYPOGRAPHY — Noto Sans Arabic 700, enlarged and high-contrast
   Applied universally — including elements with inline styles, via !important
   ═══════════════════════════════════════════════════════════════════════════ */
.ar,
[lang="ar"],
[dir="rtl"]:not(html):not(body),
.pr-b-ar,
.dim-ar,
.pr-pay-ar-batch,
.pr-pay-trig-ar,
.pr-price-ar {
  font-family: 'Noto Sans Arabic', 'Tahoma', 'Segoe UI', sans-serif !important;
  font-weight: 700 !important;
  font-style: normal !important;
  direction: rtl !important;
  unicode-bidi: embed !important;
  letter-spacing: 0 !important;
  font-feature-settings: "kern" 1, "liga" 1, "calt" 1 !important;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Size + color upgrades — bright gold for headings, bright cream for body */
.ar              { font-size: 13px !important; line-height: 1.6 !important; color: #E8D89A !important; }

/* Print-document Arabic (the PDF preview) */

.dim-ar          { font-size: 10pt !important; color: rgba(232,237,242,0.88) !important; display: block !important; margin-top: 2px; }

/* Inline aribic in cards / headings — make it pop */

.quote-htitle .ar, .sec-title .ar,
h1 .ar, h2 .ar, h3 .ar {
  font-size: 14px !important;
  font-weight: 800 !important;
  color: #F5C842 !important;
}

/* Force bold even when inline styles try to override */
span.ar, div.ar, td .ar, th .ar, label .ar {
  font-weight: 700 !important;
  color: #E8D89A !important;
}

/* Print rendering — maintain bold + readable on PDF export */
@media print {
  .ar, .pr-b-ar, .dim-ar,
  .pr-pay-ar-batch, .pr-pay-trig-ar, .pr-price-ar {

}

/* ═══════════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════════ */
@media print {

    color-adjust: exact !important;

    padding: 0 !important;

  body > *:not(#printRoot) { display: none !important; }

  .bottom-bar, .printing-toolbar, .sync-modal-overlay,
  #fileInput, #libImportInput,
  .floating-actions { display: none !important; }

  #printRoot {
    display: block !important;
    background: #0D1F35 !important;

    margin: 0 !important;
    padding: 0 !important;
    box-shadow: none !important;
    position: static !important;

    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  .pr-page {
    page-break-after: always !important;
    break-after: page !important;
    background: #0D1F35 !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .pr-page:last-child,
  .pr-page.no-break-after { page-break-after: auto !important; break-after: auto !important; }

  .pr-card,
  .pr-pay-card,
  .pr-disc {
    page-break-inside: avoid !important;
    break-inside: avoid !important;
  }

  .pr-pay-grid {
    display: grid !important;
    grid-template-columns: repeat(3, 1fr) !important;
    gap: 6px !important;
    width: 100% !important;
  }
  .pr-pay-card {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    background: rgba(255,255,255,0.04) !important;

  }
}

// Migrate old saved states: ensure materials array exists; ensure each space has selectedMaterials
function migrateState() {
  if (!state.materials || !Array.isArray(state.materials) || state.materials.length === 0) {
    state.materials = JSON.parse(JSON.stringify(DEFAULT_MATERIALS));
  }
  state.spaces.forEach(sp => {
    if (!Array.isArray(sp.selectedMaterials)) sp.selectedMaterials = [];
    if (sp.logTaxOverride === undefined) sp.logTaxOverride = '';
  });
  if (!state.paymentOverrides || typeof state.paymentOverrides !== 'object') state.paymentOverrides = {};
  if (!state.termsOverrides || typeof state.termsOverrides !== 'object') state.termsOverrides = {};
}

// ─── Persistence ──────────────────────────────────────────────────────────────
function saveState() {
  try { localStorage.setItem('qvq_state3', JSON.stringify(state)); updateSaveBadge(true); } catch(e) {}
}
function loadState() {
  try {
    const hash = location.hash.slice(1);
    if (hash && hash.startsWith('q=')) {
      const decoded = JSON.parse(decodeURIComponent(atob(hash.slice(2))));
      if (decoded && decoded.spaces) {
        state = { ...state, ...decoded };
        history.replaceState(null, '', location.pathname);
        return;
      }
    }
  } catch(e) {}
  try {
    const s = localStorage.getItem('qvq_state3') || localStorage.getItem('qvq_state2');
    if (s) { const p = JSON.parse(s); if (p.spaces) state = { ...state, ...p }; }
  } catch(e) {}
}
function updateSaveBadge(saved) {
  const el = document.getElementById('saveBadge');
  if (el) { el.textContent = saved ? t('saved') : t('unsaved'); el.style.color = saved ? '#7EC8A0' : '#F0A050'; }
}

function buildShareUrl() {
  try {
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    return location.origin + location.pathname + '#q=' + payload;
  } catch(e) { return location.href; }
}

function copyShareLink() {
  const url = buildShareUrl();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      const fb = document.getElementById('copyFeedback');
      fb.classList.add('show');
      setTimeout(() => fb.classList.remove('show'), 2000);
    }).catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  const fb = document.getElementById('copyFeedback');
  if (fb) { fb.classList.add('show'); setTimeout(() => fb.classList.remove('show'), 2000); }
}

function systemShareLink() {
  const url = buildShareUrl();
  if (navigator.share) {
    navigator.share({
      title: 'Qatar Villa Quote',
      text: `${state.clientName || 'Villa'} - ${state.projectName || 'Quote'}`,
      url: url
    }).catch(() => {});
  } else {
    copyShareLink();
  }
}

// CSV Export — Numbers/Pages/Excel friendly (UTF-8 BOM for Excel)
function exportCSV() {
  const sm = STYLES[state.style]?.mult||1;
  const tm = TIERS[state.tier]?.mult||1;
  const sLabel = STYLES[state.style]?.label||'';
  const tLabel = TIERS[state.tier]?.label||'';

  let csv = '\uFEFF'; // UTF-8 BOM for Numbers/Excel
  csv += `"Qatar Villa Quote","${state.quoteRef}","${state.clientName}","${state.projectName}"\n`;
  csv += `"Style 风格","${sLabel}","Grade 材料","${tLabel}"\n`;
  csv += '\n';
  csv += '"Icon","Space 空间","Name EN","Name AR","Area m²","Base QAR/m²","Style Mult","Tier Mult","Material Cost","Logistics","Overhead","Contingency","Subtotal QAR"\n';

  state.spaces.forEach(sp => {
    const c = calcSpace(sp);
    csv += `"${sp.icon}","${sp.name}","${sp.nameEn||''}","${sp.nameAr||''}",${c.area},${sp.base},${sm},${tm},${Math.round(c.mat)},${Math.round(c.log)},${Math.round(c.oh)},${Math.round(c.con)},${Math.round(c.total)}\n`;
  });

  const T2 = calcTotals();
  csv += '\n';
  csv += `"TOTALS","","","",${T2.totalArea.toFixed(1)},"","","",${Math.round(T2.totalMat)},${Math.round(T2.totalLog)},${Math.round(T2.totalOH)},${Math.round(T2.totalCon)},${Math.round(T2.gross)}\n`;
  csv += `"Price Range Low (QAR)","${Math.round(T2.low)}"\n`;
  csv += `"Price Range High (QAR)","${Math.round(T2.high)}"\n`;
  csv += `"Discount Applied","${(state.discount*100).toFixed(0)}%"\n`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const filename = `QVQ_${(state.clientName||'quote').replace(/\s+/g,'_')}_${Date.now()}.csv`;
  triggerDownload(blob, filename);
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const text = e.target.result;
      let imported;
      if (file.name.toLowerCase().endsWith('.csv')) {
        imported = parseCSV(text);
      } else {
        imported = JSON.parse(text);
      }
      if (imported && imported.spaces) {
        state = { ...state, ...imported };
        renderAll();
        alert(t('syncImported'));
        closeSyncModal();
      } else {
        throw new Error('Invalid file format');
      }
    } catch (err) {
      alert(t('syncImportFailed') + err.message);
    }
    event.target.value = ''; // allow same file re-pick
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  // Simple CSV importer for the format we export
  // Returns a partial state object with spaces array
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
  const spaces = [];
  let inDataSection = false;
  let clientName = '', projectName = '', quoteRef = '';
  let style = null, tier = null;
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = parseCSVLine(line);
    if (cols[0] === 'Qatar Villa Quote') {
      quoteRef = cols[1] || '';
      clientName = cols[2] || '';
      projectName = cols[3] || '';
    } else if (cols[0] && cols[0].startsWith('Style')) {
      const sLabel = cols[1];
      const tLabel = cols[3];
      for (const [k,v] of Object.entries(STYLES)) if (v.label===sLabel||v.en===sLabel) style = k;
      for (const [k,v] of Object.entries(TIERS)) if (v.label===tLabel||v.en===tLabel) tier = k;
    } else if (cols[0] === 'Icon') {
      inDataSection = true;
    } else if (inDataSection && cols[0] && cols[0]!=='TOTALS' && cols[0]!=='Price Range Low (QAR)' && cols[0]!=='Price Range High (QAR)' && cols[0]!=='Discount Applied') {
      const area = parseFloat(cols[4]) || 0;
      const base = parseFloat(cols[5]) || 350;
      spaces.push({
        id: 'sp_'+Math.random().toString(36).slice(2,8),
        icon: cols[0] || '🏠',
        name: cols[1] || 'Space',
        nameEn: cols[2] || cols[1],
        nameAr: cols[3] || '',
        base: base,
        items: '', itemsEn: '',
        qty: 1,
        area: area > 0 ? area.toString() : ''
      });
    }
  }
  return { spaces, clientName, projectName, quoteRef, style, tier };
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
    else if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; }
    else cur += ch;
  }
  result.push(cur);
  return result;
}

function importLibFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  reader.onload = (e) => {
    try {

}

function parseLibCSV(text) {
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
  const result = [];
  let headerSeen = false;
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = parseCSVLine(line);
    if (!headerSeen) { headerSeen = true; continue; }
    if (cols.length < 7) continue;
    result.push({
      id: cols[0] || ('mat_'+Math.random().toString(36).slice(2,8)),
      cat: cols[1] || 'other',
      name: cols[2] || '未命名',
      nameEn: cols[3] || cols[2] || 'Unnamed',
      brand: cols[4] || '',
      price: parseFloat(cols[5]) || 0,
      unit: cols[6] || 'pc',
    });
  }
  return result;
}

// ─── Calculations ──────────────────────────────────────────────────────────────
function getMaterialById(id) {
  return state.materials.find(m => m.id === id);
}

// Calculate selected materials cost for a space
function calcSpaceMaterials(sp) {
  if (!Array.isArray(sp.selectedMaterials) || sp.selectedMaterials.length === 0) return 0;
  let sum = 0;
  for (const sel of sp.selectedMaterials) {
    const mat = getMaterialById(sel.matId);
    if (!mat) continue;
    const qty = parseFloat(sel.qty) || 0;
    const price = parseFloat(sel.priceOverride !== '' && sel.priceOverride != null ? sel.priceOverride : mat.price) || 0;
    sum += qty * price;
  }
  return sum;
}

function calcSpace(sp) {
  const area = parseFloat(sp.area) || 0;
  const sm = STYLES[state.style]?.mult || 1;
  const tm = TIERS[state.tier]?.mult || 1;
  const discMult = 1 + (state.discount || 0);
  const matBase = area * sp.base * sm * tm * discMult;
  const matLineItems = calcSpaceMaterials(sp) * discMult;
  const mat = matBase + matLineItems;
  const defaultLog = mat * LOGISTICS_RATE;
  const defaultCon = mat * CONTINGENCY;
  const oh  = mat * OVERHEAD;
  // logTaxOverride (when set) replaces log + con (the "物流+税费" combined column)
  const overrideRaw = sp.logTaxOverride;
  const hasOverride = overrideRaw !== '' && overrideRaw != null && !isNaN(parseFloat(overrideRaw));
  let log, con;
  if (hasOverride) {
    const total = Math.max(0, parseFloat(overrideRaw));
    const ratio = LOGISTICS_RATE / (LOGISTICS_RATE + CONTINGENCY);
    log = total * ratio;
    con = total * (1 - ratio);
  } else {
    log = defaultLog;
    con = defaultCon;
  }
  return {
    area, mat, matBase, matLineItems,
    log, oh, con,
    total: mat + log + oh + con,
    logTax: log + con,
    hasLogOverride: hasOverride
  };
}

function calcTotals() {
  // include space if it has area OR has selected materials
  const rows = state.spaces.map(calcSpace).filter((r,i) => {
    return r.area > 0 || (state.spaces[i].selectedMaterials && state.spaces[i].selectedMaterials.length > 0 && r.mat > 0);
  });
  const totalArea = rows.reduce((a,r)=>a+r.area,0);
  const totalMat  = rows.reduce((a,r)=>a+r.mat,0);
  const totalLog  = rows.reduce((a,r)=>a+r.log,0);
  const totalOH   = rows.reduce((a,r)=>a+r.oh,0);
  const totalCon  = rows.reduce((a,r)=>a+r.con,0);
  const gross     = totalMat+totalLog+totalOH+totalCon;
  return { rows, totalArea, totalMat, totalLog, totalOH, totalCon, gross,
           low: gross*0.92, high: gross*1.18 };
}

// ─── Page 2: Spaces ────────────────────────────────────────────────────────────
// ─── Per-Space Material Picker ─────────────────────────────────────────────────
function renderMatPickerForSpace(sp) {
  const sel = sp.selectedMaterials || [];
  const matCount = sel.length;
  const showPicker = sp._showMatPicker === true;
  const totalMatCost = calcSpaceMaterials(sp);

  const linesHtml = sel.map((s,idx) => {
    const m = getMaterialById(s.matId);
    if (!m) return '';
    const cat = MATERIAL_CATEGORIES[m.cat] || MATERIAL_CATEGORIES.other;
    const qty = parseFloat(s.qty) || 0;
    const priceUsed = (s.priceOverride !== '' && s.priceOverride != null) ? parseFloat(s.priceOverride) : m.price;
    const cost = qty * priceUsed;
    return `
      <div class="mat-line">
        <span class="mat-line-icon">${cat.icon}</span>
        <span class="mat-line-name">${m.name}${m.brand?`<span class="mat-line-brand">· ${m.brand}</span>`:''}</span>
        <input class="mat-line-qty" type="number" min="0" step="0.5" value="${s.qty}" onchange="updateSpaceMatQty('${sp.id}',${idx},this.value)" inputmode="decimal" title="数量 Qty"/>
        <span class="mat-line-unit">${m.unit||'pc'}</span>
        <span class="mat-line-unit">×</span>
        <input class="mat-line-price" type="number" min="0" value="${priceUsed}" onchange="updateSpaceMatPrice('${sp.id}',${idx},this.value)" inputmode="decimal" title="单价 Price (QAR)"/>
        <span class="mat-line-cost">${fmt(cost)}</span>
        <button class="mat-line-del" onclick="removeSpaceMaterial('${sp.id}',${idx})" title="移除 Remove">×</button>
      </div>
    `;
  }).filter(Boolean).join('');

  // Build category-grouped dropdown
  const grouped = {};
  for (const cat of Object.keys(MATERIAL_CATEGORIES)) grouped[cat] = [];
  for (const m of state.materials) {
    const c = MATERIAL_CATEGORIES[m.cat] ? m.cat : 'other';
    grouped[c].push(m);
  }
  const optGroups = Object.entries(MATERIAL_CATEGORIES).map(([k,v]) => {
    const items = grouped[k] || [];
    if (items.length === 0) return '';
    const opts = items.map(m =>
      `<option value="${m.id}">${m.name}${m.brand?' · '+m.brand:''} (${m.price} QAR/${m.unit||'pc'})</option>`
    ).join('');
    return `<optgroup label="${v.icon} ${v.label} ${v.en}">${opts}</optgroup>`;
  }).join('');

  return `
    <div class="mat-picker-wrap">
      <div class="mat-picker-head">
        <span>📦 材料明细 Materials ${matCount > 0 ? `(${matCount} 项)` : ''}</span>
        <button class="mat-picker-toggle" onclick="toggleSpaceMatPicker('${sp.id}')">${showPicker?'收起 ▴':'展开 ▾'}</button>
      </div>
      ${showPicker || matCount > 0 ? `
        <div class="mat-picker-list">${linesHtml || '<div style="font-size:10px;color:var(--muted);padding:4px;text-align:center">暂无材料 No materials added</div>'}</div>
        ${showPicker ? `
          <div class="mat-picker-add">
            <select class="mat-picker-select" id="matSel_${sp.id}">
              <option value="">— 选择材料 / Select material —</option>
              ${optGroups}
            </select>
            <button class="custom-confirm" style="font-size:11px;padding:6px 12px" onclick="addSpaceMaterial('${sp.id}')">＋ 加入 Add</button>
          </div>
        ` : ''}
        ${matCount > 0 ? `<div class="mat-line-summary">
          <span>材料合计 Materials Subtotal</span>
          <span style="font-weight:700">${fmt(totalMatCost)}</span>
        </div>` : ''}
      ` : ''}
    </div>
  `;
}

function toggleSpaceMatPicker(spId) {
  const sp = state.spaces.find(s => s.id === spId);
  if (sp) {
    sp._showMatPicker = !sp._showMatPicker;
    renderAll();
  }
}

function addSpaceMaterial(spId) {
  const sp = state.spaces.find(s => s.id === spId);
  if (!sp) return;
  if (!Array.isArray(sp.selectedMaterials)) sp.selectedMaterials = [];
  const sel = document.getElementById('matSel_'+spId);
  const matId = sel?.value;
  if (!matId) {
    alert('请先在下拉中选择材料 / Please select a material first');
    return;
  }
  // default qty: if material is per m², default to space area; else 1
  const m = getMaterialById(matId);
  const defaultQty = (m?.unit === 'm²' || m?.unit === 'm') && parseFloat(sp.area) > 0
    ? parseFloat(sp.area)
    : 1;
  sp.selectedMaterials.push({
    matId: matId,
    qty: defaultQty,
    priceOverride: '' // empty = use library price
  });
  renderAll();
}

function updateSpaceMatQty(spId, idx, val) {
  const sp = state.spaces.find(s => s.id === spId);
  if (!sp || !sp.selectedMaterials || !sp.selectedMaterials[idx]) return;
  sp.selectedMaterials[idx].qty = parseFloat(val) || 0;
  saveState();
  renderAll();
}

function updateSpaceMatPrice(spId, idx, val) {
  const sp = state.spaces.find(s => s.id === spId);
  if (!sp || !sp.selectedMaterials || !sp.selectedMaterials[idx]) return;
  sp.selectedMaterials[idx].priceOverride = val === '' ? '' : (parseFloat(val) || 0);
  saveState();
  renderAll();
}

function removeSpaceMaterial(spId, idx) {
  const sp = state.spaces.find(s => s.id === spId);
  if (!sp || !sp.selectedMaterials) return;
  sp.selectedMaterials.splice(idx, 1);
  renderAll();
}

function renderSpaces() {
  const rows = state.spaces.map((sp,i) => {
    const calc = calcSpace(sp);
    const hasVal = calc.area > 0;
    const matCount = (sp.selectedMaterials||[]).length;

    return `<div class="space-row${hasVal||matCount>0?' has-value':''}" id="row_${sp.id}" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%">
        <span class="space-icon">${sp.icon}</span>
        <div class="space-info">
          <div class="space-name">${spaceName}</div>
          ${spaceAlt?`<div class="space-name-en">${spaceAlt}</div>`:''}
          <div class="space-sub">${itemsStr}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
          <div class="space-controls">
            <div class="area-quick">
              <button class="area-quick-btn" onclick="adjustArea('${sp.id}',-5)" title="-5">−</button>
              <button class="area-quick-btn" onclick="adjustArea('${sp.id}',5)" title="+5">+</button>
            </div>
            <input class="space-input" type="number" min="0" placeholder="0"

              onchange="updateArea('${sp.id}',this.value)"
              oninput="updateArea('${sp.id}',this.value)"
              inputmode="decimal"/>
            <span class="space-unit">m²</span>
          </div>
          <div class="base-price-wrap">
            <input class="base-price-input" type="number" min="50" max="5000"
              value="${sp.base}"
              onchange="updateBase('${sp.id}',this.value)"
              oninput="updateBase('${sp.id}',this.value)"
              inputmode="decimal" title="Base rate QAR/m²"/>
            <span class="base-price-label">QAR/m²</span>
          </div>
        </div>
        ${(state.style&&state.tier&&(hasVal||matCount>0))?`<div class="space-cost">${fmt(calc.total)}</div>`:`<div class="space-cost" style="color:var(--muted);font-size:10px">${sp.base} QAR/m²</div>`}
        <button class="space-del" onclick="deleteSpace('${sp.id}')" title="删除 Delete">×</button>
      </div>
      ${renderMatPickerForSpace(sp)}

  const presets = ADD_PRESETS.filter(p => !state.spaces.find(s=>s.nameEn===p.nameEn));
  const presetBtns = presets.map(p => {

    return `<button class="add-btn" onclick="addPreset('${encodeURIComponent(JSON.stringify(p))}')">${p.icon} ${label}</button>`;
  }).join('');

  const totalArea = state.spaces.reduce((a,sp)=>a+(parseFloat(sp.area)||0),0);

  return `<div class="page">
    <div class="sec-head">
      <div class="sec-title">${t('areaTitle')}</div>
      <div class="sec-sub">${t('areaSub')}</div>
    </div>
    ${(!state.style||!state.tier)?`<div class="warn-box">${t('areaWarn')}</div>`:''}
    <div class="space-list">${rows}</div>
    ${totalArea>0?`<div class="area-summary"><span class="area-label">${t('areaTotal')}</span><span class="area-val">${totalArea.toFixed(1)} m²</span></div>`:''}
    <div class="add-section">
      <div class="add-section-title">${t('addMore')}</div>
      <div class="add-grid">${presetBtns}</div>
      <div class="custom-add mt12">

}

function updateArea(id, val) {
  const sp = state.spaces.find(s=>s.id===id);
  if (sp) { sp.area = val; saveState(); updateSaveBadge(false); renderPrintRoot(); }
}
function adjustArea(id, delta) {
  const sp = state.spaces.find(s=>s.id===id);
  if (sp) { const cur = parseFloat(sp.area)||0; sp.area = Math.max(0, cur+delta).toString(); renderAll(); }
}
function updateBase(id, val) {
  const sp = state.spaces.find(s=>s.id===id);
  if (sp) { sp.base = Math.max(50, parseFloat(val)||50); saveState(); updateSaveBadge(false); renderPrintRoot(); }
}
function deleteSpace(id) { state.spaces = state.spaces.filter(s=>s.id!==id); renderAll(); }
function addPreset(encoded) {
  const p = JSON.parse(decodeURIComponent(encoded));
  state.spaces.push({ id:uid(), icon:p.icon, name:p.name, nameEn:p.nameEn, nameAr:p.nameAr||p.nameEn, base:p.base,

}
function addCustomSpace() {
  const inp = document.getElementById('customSpaceName');

// ─── Logistics+Tax editable cell handlers ─────────────────────────────────────
// Per-space override for the "物流+税费" combined column.
// Uses fast in-place DOM update to keep input focus while typing.
function updateLogTax(spId, val) {
  const sp = state.spaces.find(s => s.id === spId);
  if (!sp) return;
  if (val === '' || val == null) {
    sp.logTaxOverride = '';
  } else {
    const num = parseFloat(val);
    sp.logTaxOverride = isNaN(num) ? '' : Math.max(0, num);
  }
  saveState();
  updateSaveBadge(false);
  // Fast in-place update — keeps input focused & cursor in place
  updateAllRates();
  // Refresh hidden print root so PDF reflects the change
  renderPrintRoot();
}

function resetLogTax(spId) {
  const sp = state.spaces.find(s => s.id === spId);
  if (!sp) return;
  sp.logTaxOverride = '';
  saveState();
  // Full re-render — needed because the ↺ reset button must disappear
  renderAll();
}

// In-place update of all calculated cells without full re-render.
// Critical for keeping focus/cursor on the logistics+tax input while typing.
function updateAllRates() {
  const T2 = calcTotals();

  // Update each row's calculated cells
  state.spaces.forEach(sp => {
    if (parseFloat(sp.area) <= 0 && (sp.selectedMaterials || []).length === 0) return;
    const c = calcSpace(sp);
    const row = document.querySelector(`tr[data-sp-id="${sp.id}"]`);
    if (!row) return;

    const matCell = row.querySelector('.cell-mat');
    if (matCell) matCell.textContent = fmt(c.mat);

    const logInput = row.querySelector('.cell-logtax-input');
    if (logInput && document.activeElement !== logInput) {
      logInput.value = Math.round(c.logTax);
    }
    if (logInput) {
      logInput.classList.toggle('is-override', !!c.hasLogOverride);
    }

    const subCell = row.querySelector('.cell-subtotal');
    if (subCell) subCell.textContent = fmt(c.total);
  });

  // Update table footer totals
  const tfArea = document.getElementById('tf-area');
  const tfMat  = document.getElementById('tf-mat');
  const tfLog  = document.getElementById('tf-log');
  const tfSub  = document.getElementById('tf-sub');
  if (tfArea) tfArea.textContent = T2.totalArea.toFixed(1) + ' m²';
  if (tfMat)  tfMat.textContent  = fmt(T2.totalMat);
  if (tfLog)  tfLog.textContent  = fmt(T2.totalLog + T2.totalCon);
  if (tfSub)  tfSub.textContent  = fmt(T2.gross);

  // Update price band
  const priceLow  = document.querySelector('.price-low');
  const priceHigh = document.querySelector('.price-high');
  if (priceLow)  priceLow.textContent  = T2.gross > 0 ? fmt(T2.low)  : 'QAR —';
  if (priceHigh) priceHigh.textContent = T2.gross > 0 ? fmt(T2.high) : 'QAR —';

  // Update breakdown bars
  const bVals = document.querySelectorAll('.b-val');
  if (bVals.length >= 5) {
    const vals = [T2.totalMat, T2.totalLog, T2.totalMat * 0.10, T2.totalOH, T2.totalCon];
    vals.forEach((v, i) => { if (bVals[i]) bVals[i].textContent = fmt(v); });
  }
  // Update breakdown total
  const bTotal = document.querySelector('.b-total .text-gold');
  if (bTotal) bTotal.textContent = T2.gross > 0 ? fmt(T2.gross) : 'QAR —';

  updateSaveBadge(true);
}

// One-click Save + Export HD PDF
function saveAndExportHDPDF() {
  saveState();
  updateSaveBadge(true);
  const badge = document.getElementById('saveBadge');
  if (badge) {
    const prev = badge.textContent;
    badge.textContent = '✓ 已保存 Saved';
    setTimeout(() => { badge.textContent = prev; }, 1200);
  }

    state.tab = 3;
    renderAll();
  }

}

// ─── Payment card editing ─────────────────────────────────────────────────────
function updatePaymentPct(idx, val) {
  if (!state.paymentOverrides) state.paymentOverrides = {};
  if (!state.paymentOverrides[idx]) state.paymentOverrides[idx] = {};
  const num = parseFloat(val);
  state.paymentOverrides[idx].pct = isNaN(num) ? '' : Math.max(0, Math.min(100, num));
  saveState();
  updateSaveBadge(false);
  // Update the corresponding card amount in-place to avoid focus loss
  const T2 = calcTotals();
  const card = document.querySelector(`.pay-card[data-pay-idx="${idx}"]`);
  if (card) {
    const amount = card.querySelector('.pay-amount');
    if (amount) {
      const pct = (num || 0) / 100;
      // Replace just the leading text node (before the <span>)
      const firstNode = amount.firstChild;
      if (firstNode && firstNode.nodeType === Node.TEXT_NODE) {
        firstNode.nodeValue = (T2.gross > 0 ? fmt(T2.gross * pct) : 'QAR —') + ' ';
      }
    }
  }
  renderPrintRoot();
}

function updatePaymentTrigger(idx, langKey, val) {
  if (!state.paymentOverrides) state.paymentOverrides = {};
  if (!state.paymentOverrides[idx]) state.paymentOverrides[idx] = {};
  state.paymentOverrides[idx]['trigger' + langKey] = val;
  saveState();
  updateSaveBadge(false);
  renderPrintRoot();
}

function updatePaymentProducts(idx, val) {
  if (!state.paymentOverrides) state.paymentOverrides = {};
  if (!state.paymentOverrides[idx]) state.paymentOverrides[idx] = {};
  state.paymentOverrides[idx].products = val;
  saveState();
  updateSaveBadge(false);
  renderPrintRoot();
}

function renderQuote() {
  const T2 = calcTotals();
  const sm = STYLES[state.style]?.mult||1;
  const tm = TIERS[state.tier]?.mult||1;
  const sLabel = lang==='en' ? (STYLES[state.style]?.en||'—') : (STYLES[state.style]?.label||'—');
  const tLabel = lang==='en' ? (TIERS[state.tier]?.en||'—')   : (TIERS[state.tier]?.label||'—');
  const today = new Date().toLocaleDateString(lang==='en'?'en-GB':'zh-CN');
  const disc = state.discount || 0;

  const breakdowns = [
    { label: lang==='en'?'Materials 材料货值':'材料货值 Materials',                           labelAr:'قيمة المواد',            val:T2.totalMat,    color:'#1A3A5C' },
    { label: lang==='en'?'Logistics China→Qatar 物流运输':'物流运输 Logistics (China→Qatar)', labelAr:'الشحن والخدمات اللوجستية', val:T2.totalLog,    color:'#2E6B4F' },
    { label: lang==='en'?'Customs 5% + VAT 5% 关税+VAT':'关税+VAT Customs 5%+VAT 5%',       labelAr:'الجمارك 5% + ضريبة القيمة المضافة 5%', val:T2.totalMat*0.10,color:'#7B5E3A' },
    { label: lang==='en'?'Overhead & Margin 运营+利润':'运营+利润 Overhead & Margin',          labelAr:'المصاريف العامة والهامش',  val:T2.totalOH,     color:'#4A3060' },
    { label: lang==='en'?'Contingency Buffer 材料缓冲':'材料未定缓冲 Contingency ±',          labelAr:'احتياطي المواد ±',         val:T2.totalCon,    color:'#B88600' },
  ];

  const spaceRows = state.spaces.filter(sp => parseFloat(sp.area)>0 || (sp.selectedMaterials||[]).length>0).map(sp => {
    const c = calcSpace(sp);
    const unitRate = Math.round(sp.base * sm * tm);
    const spLabel = lang==='en' ? (sp.nameEn||sp.name) : sp.name;
    const spAr = sp.nameAr || sp.nameEn || sp.name;
    const matCount = (sp.selectedMaterials||[]).length;
    const logTaxValue = Math.round(c.logTax);
    const isOverride = c.hasLogOverride;
    return `<tr data-sp-id="${sp.id}">
      <td>${sp.icon} ${spLabel}${matCount>0?`<br><span style="font-size:9px;color:#D4A017">📦 ${matCount} ${lang==='en'?'materials':'项材料'}</span>`:''}<br><span class="ar">${spAr}</span></td>
      <td class="ta-center">${c.area} m²</td>
      <td class="ta-center">${unitRate.toLocaleString()}</td>
      <td class="ta-right cell-mat">${fmt(c.mat)}</td>
      <td class="ta-right">
        <span class="cell-logtax-wrap">
          <span class="qar-prefix">QAR</span>
          <input type="number" min="0" step="1" inputmode="decimal"
            class="cell-logtax-input${isOverride?' is-override':''}"
            value="${logTaxValue}"
            oninput="updateLogTax('${sp.id}',this.value)"
            onchange="updateLogTax('${sp.id}',this.value)"
            title="${lang==='en'?'Edit Logistics+Tax · auto-recalculates total':'编辑物流+税费 · 自动重算总价'}"/>
          ${isOverride?`<button class="cell-logtax-reset" onclick="resetLogTax('${sp.id}')" title="恢复默认 Reset">↺</button>`:''}
        </span>
      </td>
      <td class="ta-right fw7 text-gold cell-subtotal">${fmt(c.total)}</td>
    </tr>`;
  }).join('');

  const payments = getPayments();
  // Apply user overrides if any
  payments.forEach((p, i) => {

  const bRows = breakdowns.map(b => {
    const p = T2.gross>0 ? b.val/T2.gross : 0;
    return `<div class="b-row">
      <div class="b-dot" style="background:${b.color}"></div>

  const discOptions = [
    { label: lang==='en'?'No Adj.':'无调整',    val: 0     },
    { label: '-3%',  val: -0.03 },
    { label: '-5%',  val: -0.05 },
    { label: '-8%',  val: -0.08 },
    { label: '-10%', val: -0.10 },
    { label: '+5%',  val: 0.05  },
    { label: '+10%', val: 0.10  },
  ];
  const discBtns = discOptions.map(d =>
    `<button class="disc-btn${disc===d.val?' active':''}${d.val<0?' disc-neg':''}" onclick="setDiscount(${d.val})">${d.label}</button>`

  const terms = getTerms();

  return `<div class="page">
    <div class="client-row">
      <div class="client-field">
        <label class="client-label">${t('clientName')} &nbsp;<span class="ar" style="font-size:9px">${t('arClientLabel')}</span></label>

      <div class="client-field">
        <label class="client-label">${t('projectName')} &nbsp;<span class="ar" style="font-size:9px">${t('arProjectLabel')}</span></label>

    <div class="quote-card">
      <div class="quote-header-band">

          <div class="quote-htitle">${t('quoteTitle')}</div>

            ${t('styleLabel')}: ${sLabel} &nbsp;·&nbsp; ${t('matLabel')}: ${tLabel}
            &nbsp;·&nbsp; <span class="ar">${t('arStyleLabel')}: ${sLabel} · ${t('arMatLabel')}: ${tLabel}</span><br>
            ${t('areaLabel')}: ${T2.totalArea.toFixed(1)} m² &nbsp;·&nbsp; ${t('spacesLabel')}: ${state.spaces.filter(s=>parseFloat(s.area)>0).length}
            &nbsp;·&nbsp; <span class="ar">${t('arAreaLabel')}: ${T2.totalArea.toFixed(1)} م²</span>
            ${disc!==0?`<br><span style="color:${disc<0?'#7EC8A0':'#F0A050'}">⚑ ${disc>0?'+':''}${(disc*100).toFixed(0)}% ${lang==='en'?'adjustment applied':'调整已应用'}</span>`:''}
          </div>
        </div>
        <div class="quote-hdate">

        </div>
      </div>

      <div class="price-band">
        <div class="price-label">${t('priceRangeLabel')}</div>
        <div style="font-size:9px;color:rgba(255,184,0,0.5);margin-bottom:8px;font-family:'Noto Sans Arabic',sans-serif;direction:rtl">${t('arPriceRange')}</div>
        <div class="price-range">
          <span class="price-low">${T2.gross>0?fmt(T2.low):'QAR —'}</span>
          <span class="price-sep">—</span>
          <span class="price-high">${T2.gross>0?fmt(T2.high):'QAR —'}</span>
        </div>
        <div class="price-note">${t('priceNote')}</div>
        ${T2.gross>0&&T2.totalArea>0?`<div class="price-sqm">${t('sqmLabel')} ≈ QAR ${Math.round(T2.gross/T2.totalArea).toLocaleString()} / m² &nbsp;·&nbsp; <span class="ar" style="font-size:10px">${t('arSqmLabel')} ≈ QAR ${Math.round(T2.gross/T2.totalArea).toLocaleString()} / م²</span></div>`:''}
        <div class="manual-override">
          <span class="manual-override-label">${t('manualAdjLabel')}</span>
          <div class="manual-discount">${discBtns}</div>
        </div>
      </div>

      <div class="breakdown-wrap">
        <div class="breakdown-title">
          ${t('breakdownTitle')}
          &nbsp;<span class="ar" style="font-size:9px;font-weight:400">${t('arBreakdownTitle')}</span>
        </div>
        ${bRows}
        <div class="b-total">
          <span>${t('breakdownTotal')} <span class="ar" style="font-size:10px;font-weight:400">${t('arBreakdownTotal')}</span></span>
          <span class="text-gold">${T2.gross>0?fmt(T2.gross):'QAR —'}</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        ${t('spaceBreakTitle')}
        &nbsp;<span class="ar">${t('arSpaceBreak')}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--gold);font-weight:600">✏️ ${lang==='en'?'Logistics+Tax editable':'物流+税费可编辑'}</span>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th>${t('colSpace')}</th>
            <th>${t('colArea')}</th>
            <th>${t('colUnit')}</th>
            <th>${t('colMat')}<br><span class="ar">${t('arColMat')}</span></th>
            <th>${t('colLogTax')} ✏️<br><span class="ar">${t('arColLogTax')}</span></th>
            <th>${t('colSubtotal')}<br><span class="ar">${t('arColSub')}</span></th>
          </tr></thead>
          <tbody>${spaceRows||`<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px">${t('noAreaMsg')}</td></tr>`}</tbody>
          ${spaceRows ? `<tfoot>
            <tr style="background:rgba(184,134,0,0.12);border-top:2px solid rgba(184,134,0,0.4)">
              <td style="font-weight:700;color:var(--gold)">${lang==='en'?'TOTAL':'总计'} <span class="ar">الإجمالي</span></td>
              <td class="ta-center fw7" id="tf-area">${T2.totalArea.toFixed(1)} m²</td>
              <td></td>
              <td class="ta-right fw7" id="tf-mat">${fmt(T2.totalMat)}</td>
              <td class="ta-right fw7 text-gold" id="tf-log">${fmt(T2.totalLog+T2.totalCon)}</td>
              <td class="ta-right fw7 text-gold" id="tf-sub" style="font-size:13px">${fmt(T2.gross)}</td>
            </tr>
          </tfoot>` : ''}
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        ${t('payTitle')}
        &nbsp;<span class="ar" style="font-size:9px;font-weight:400;opacity:0.8">${t('arPayTitle')}</span>
      </div>
      <div style="padding:14px"><div class="pay-grid">${payCards}</div></div>
    </div>

    <div class="card">
      <div class="card-head">
        ${t('termsTitle')}
        &nbsp;<span class="ar">${t('arTermsTitle')}</span>
        <span style="margin-left:auto;font-size:10px;color:var(--gold);font-weight:600">✏️ ${lang==='en'?'Click to edit':'点击编辑'}</span>
      </div>
      <div style="padding:12px">
        ${terms.map((txt,i)=>`<div class="disc" contenteditable="true"
          data-term-idx="${i}"
          onblur="updateTermText(${i},this.innerText)"
          style="border-left:3px solid ${['#1A3A5C','#2E6B4F','#B88600','#555','#1A3A5C','#7B5E3A'][i]};outline:none;cursor:text"

        <div style="margin-top:8px;font-size:10px;color:var(--muted);text-align:right">
          <button onclick="resetTerms()" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);font-size:10px;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:var(--font-body)">↺ ${lang==='en'?'Reset to defaults':'恢复默认条款'}</button>
        </div>
      </div>
    </div>
  </div>`;
}

// ─── Shared data builders ─────────────────────────────────────────────────────

// ─── Print Root Renderer (separate, optimized for A4 PDF) ─────────────────────
function renderPrintRoot() {
  const root = document.getElementById('printRoot');
  if (!root) return;

  const T2 = calcTotals();
  const sLabel = STYLES[state.style] ? (STYLES[state.style].label + ' / ' + STYLES[state.style].en) : '—';
  const tLabel = TIERS[state.tier]   ? (TIERS[state.tier].label + ' / ' + TIERS[state.tier].en) : '—';
  const sm = STYLES[state.style]?.mult||1;
  const tm = TIERS[state.tier]?.mult||1;
  const today = new Date().toLocaleDateString('en-GB');
  const disc = state.discount || 0;

  // ── Page 1: Header + Client + Price + Cost Breakdown ──
  const breakdowns = [
    { labelEn:'Materials 材料货值',                           labelAr:'قيمة المواد',                              val:T2.totalMat,      color:'#4A7FBF' },
    { labelEn:'Logistics China→Qatar 物流运输',                labelAr:'الشحن والخدمات اللوجستية',                  val:T2.totalLog,      color:'#3FB57A' },
    { labelEn:'Customs 5% + VAT 5% 关税+VAT',                 labelAr:'الجمارك 5% + ضريبة القيمة المضافة 5%',     val:T2.totalMat*0.10, color:'#C8995A' },
    { labelEn:'Overhead & Margin 运营+利润',                    labelAr:'المصاريف العامة والهامش',                  val:T2.totalOH,       color:'#9070BB' },
    { labelEn:'Contingency Buffer 材料缓冲',                    labelAr:'احتياطي المواد ±',                         val:T2.totalCon,      color:'#D4A017' },
  ];

  const bRowsHtml = breakdowns.map(b => {
    const p = T2.gross > 0 ? b.val/T2.gross : 0;
    return `<div class="pr-b-row">
      <div class="pr-b-dot" style="background:${b.color}"></div>
      <div class="pr-b-label">${b.labelEn}<span class="pr-b-ar">${b.labelAr}</span></div>
      <div class="pr-b-bar-track"><div class="pr-b-bar-fill" style="width:${(p*100).toFixed(0)}%;background:${b.color}"></div></div>
      <div class="pr-b-pct">${(p*100).toFixed(0)}%</div>
      <div class="pr-b-val">${fmt(b.val)}</div>
    </div>`;
  }).join('');

  const page1 = `
    <div class="pr-page">
      <div class="pr-header">
        <div class="pr-header-left">
          <div class="pr-logo-title">◈ QATAR VILLA QUOTE</div>
          <div class="pr-logo-sub">卡塔尔别墅装修报价 · نظام تسعير الفلل</div>
        </div>
        <div class="pr-ref-block">
          <strong>Ref:</strong> ${state.quoteRef}<br>
          <strong>Date:</strong> ${today}<br>
          <strong>Valid:</strong> 30 Days
        </div>
      </div>

      <div class="pr-client-row">
        <div class="pr-client-cell">
          <div class="pr-client-label">CLIENT 客户 / العميل</div>
          <div class="pr-client-val">${state.clientName || '—'}</div>
        </div>
        <div class="pr-client-cell">
          <div class="pr-client-label">PROJECT 项目 / المشروع</div>
          <div class="pr-client-val">${state.projectName || '—'}</div>
        </div>
        <div class="pr-client-cell">
          <div class="pr-client-label">STYLE / GRADE 风格 / 档次</div>
          <div class="pr-client-val" style="font-size:9.5pt">${sLabel}<br>${tLabel}</div>
        </div>
      </div>

      <div class="pr-price-band">
        <div class="pr-price-label">PRICE RANGE 报价区间 (Materials TBC ±15%)</div>
        <div class="pr-price-ar">نطاق السعر (المواد غير مؤكدة ±15%)</div>
        <div class="pr-price-range">
          <span class="pr-price-low">${T2.gross>0?fmt(T2.low):'QAR —'}</span>
          <span class="pr-price-sep">—</span>
          <span class="pr-price-high">${T2.gross>0?fmt(T2.high):'QAR —'}</span>
        </div>
        <div class="pr-price-note">⚠️ Materials unconfirmed · 材料品牌未最终确认 · price variance ±15%</div>
        ${T2.gross>0&&T2.totalArea>0?`<div class="pr-sqm">Blended rate 综合单价 ≈ QAR ${Math.round(T2.gross/T2.totalArea).toLocaleString()} / m²&nbsp;&nbsp;|&nbsp;&nbsp;Total Area 总面积 ${T2.totalArea.toFixed(1)} m² &nbsp;|&nbsp; ${state.spaces.filter(s=>parseFloat(s.area)>0).length} Spaces</div>`:''}
        ${disc!==0?`<div style="margin-top:6px;font-size:8pt;color:${disc<0?'#7EC8A0':'#F0A050'}">⚑ ${disc>0?'+':''}${(disc*100).toFixed(0)}% Quote Adjustment Applied 报价调整已应用</div>`:''}
      </div>

      <div class="pr-card">
        <div class="pr-card-head">📊 Cost Breakdown 费用构成 · تفصيل التكاليف</div>
        <div class="pr-card-body">
          ${bRowsHtml}
          <div class="pr-b-total">
            <span>Total 合计 (Midpoint) · الإجمالي</span>
            <span class="pr-b-total-val">${T2.gross>0?fmt(T2.gross):'QAR —'}</span>
          </div>
        </div>
      </div>
    </div>
  `;

  // ── Page 2: Space Breakdown Table ──
  const filteredSpaces = state.spaces.filter(sp => parseFloat(sp.area)>0 || (sp.selectedMaterials||[]).length>0);
  const spaceTableRows = filteredSpaces.length ? filteredSpaces.map(sp => {
    const c = calcSpace(sp);

    const spLabel = (sp.name || '') + (sp.nameEn ? ' / '+sp.nameEn : '');
    const spAr = sp.nameAr || '';

  const page2 = `

          <table class="pr-tbl">
            <thead><tr>
              <th>Space 空间 / الفضاء</th>
              <th>Area<br>m²</th>
              <th>Rate<br>QAR/m²</th>
              <th>Material<br>المواد</th>
              <th>Log+Tax<br>الشحن</th>
              <th>Subtotal<br>الإجمالي</th>
            </tr></thead>
            <tbody>${spaceTableRows}</tbody>
            ${filteredSpaces.length ? `<tfoot>
              <tr style="background:rgba(184,134,0,0.15)">
                <td style="font-weight:700;color:#D4A017">TOTAL 总计 · الإجمالي</td>
                <td style="text-align:center;font-weight:700">${T2.totalArea.toFixed(1)} m²</td>
                <td></td>
                <td style="text-align:right;font-weight:700">${fmt(T2.totalMat)}</td>
                <td style="text-align:right;font-weight:700;color:#D4A017">${fmt(T2.totalLog+T2.totalCon)}</td>
                <td style="text-align:right;font-weight:800;color:#D4A017">${fmt(T2.gross)}</td>
              </tr>
            </tfoot>` : ''}
          </table>
        </div>
      </div>
    </div>
  `;

  // ── Page 3: Payment Schedule + Terms ──
  const payments = getPayments();
  // Apply user overrides
  payments.forEach((p, i) => {
    const ov = (state.paymentOverrides || {})[i] || {};
    if (ov.pct != null && ov.pct !== '') p.pct2 = parseFloat(ov.pct) / 100;
    if (ov.triggerZh != null && ov.triggerZh !== '') p.triggerZh = ov.triggerZh;
    if (ov.triggerEn != null && ov.triggerEn !== '') p.triggerEn = ov.triggerEn;
    if (ov.products != null && ov.products !== '') p.products = ov.products;
  });
  const payCardsHtml = payments.map(p => `
    <div class="pr-pay-card">
      <div class="pr-pay-head" style="background:${p.color}">${p.batchZh} / ${p.batchEn}</div>
      <div class="pr-pay-ar-batch">${p.batchAr}</div>
      <div class="pr-pay-amt">${T2.gross>0?fmt(T2.gross*p.pct2):'QAR —'} <span class="pr-pay-pct">(${(p.pct2*100).toFixed(0)}%)</span></div>
      <div class="pr-pay-trig">📅 ${p.triggerZh}</div>
      <div class="pr-pay-trig2">${p.triggerEn}</div>
      <div class="pr-pay-trig-ar">${p.triggerAr}</div>
      <div class="pr-pay-prod">📦 ${p.products}</div>
    </div>
  `).join('');

  const defaultTerms = [
    '本报价为概算，材料品牌及规格未最终确认，实际合同价格以确认材料清单后为准，浮动不超过 ±15%。',
    'This is a preliminary estimate. Final contract price subject to confirmed material specifications (±15% variance).',
    'هذا عرض سعر تقريبي. السعر النهائي مرهون بتأكيد المواد وقد يتفاوت بنسبة ±15%.',
    '报价有效期：30天（自出具之日起）· Valid 30 days · صالح 30 يومًا',
    '所有产品从中国定制生产，全程供货周期约45天，付款须在对应工程节点前45天完成。 All products are custom-manufactured in China. Total lead time approx. 45 days.',
    '付款到账后方启动产品生产及发运，所有权在安装验收前归乙方所有。 Production and shipping commence upon cleared payment. Title remains with Supplier until installation acceptance.',
  ];
  const termsOv = state.termsOverrides || {};
  const terms = defaultTerms.map((d, i) => (termsOv[i] != null && termsOv[i] !== '') ? termsOv[i] : d);
  const termColors = ['#1A3A5C','#2E6B4F','#B88600','#7B5E3A','#1A3A5C','#7B5E3A'];

  const page3 = `
    <div class="pr-page no-break-after">
      <div class="pr-card" style="margin-top:0">
        <div class="pr-card-head">💳 Payment Schedule 付款计划 · جدول الدفعات</div>
        <div class="pr-card-body">
          <div class="pr-pay-grid">${payCardsHtml}</div>
        </div>
      </div>

      <div class="pr-card">
        <div class="pr-card-head">📋 Terms & Conditions 报价说明 · شروط العرض</div>
        <div class="pr-card-body">
          ${terms.map((t,i)=>`<div class="pr-disc" style="border-left:3px solid ${termColors[i]}">${t}</div>`).join('')}
        </div>
      </div>

      <div class="pr-footer">
        Qatar Villa Quote · ${state.quoteRef} · Generated ${today} · 此报价由系统自动生成 · Generated automatically
      </div>
    </div>
  `;

  root.innerHTML = page1 + page2 + page3;
}

// ─── Main render ───────────────────────────────────────────────────────────────
function renderMain() {
  const el = document.getElementById('mainContent');
  let html = '';
  switch(state.tab) {
    case 0: html = renderStyle(); break;
    case 1: html = renderTier(); break;
    case 2: html = renderSpaces(); break;
    case 3: html = renderQuote(); break;
  }
  el.innerHTML = html;
}

function renderBottom() {
  const el = document.getElementById('bottomBar');
  const tab = state.tab;
  const hasSpaces = state.spaces.some(s=>parseFloat(s.area)>0);
  const canNext = (tab===0&&state.style)||(tab===1&&state.tier)||(tab===2&&hasSpaces);

  if (tab === 3) {
    el.innerHTML = `
      <button class="btn-back" onclick="goTab(2)">${t('backBtn')}</button>
      <button class="btn-reset" onclick="resetQuote()">${t('newQuote')}</button>
      <button class="btn-print" onclick="doPrint()">${t('printBtn')}</button>`;
  } else {
    el.innerHTML = `
      ${tab>0?`<button class="btn-back" onclick="goTab(${tab-1})">${t('prevStep')}</button>`:'<div></div>'}
      <button class="btn-next" ${canNext?'':'disabled'} onclick="goTab(${tab+1})">
        ${tab===2?t('genQuote'):t('nextStep')}
      </button>`;
  }
}

// ─── Print flow (iOS Safari + Mac Safari + Chrome compatible) ─────────────────
// Strategy:
//   1. Click "Print" → enter print preview mode (full-screen overlay)
//   2. User sees the EXACT print output filling their screen, can scroll all 3 pages
//   3. Click "Print" in toolbar → calls window.print()
//   4. After print or cancel, exit preview mode
//
// This works around iOS Safari's print() unreliability AND solves the "only
// prints visible part" problem because the print content IS the only thing
// rendered when print() is called.

function isIOSDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function doPrint() {
  // 1. Re-render print root with latest data
  renderPrintRoot();

  // 2. Update toolbar with stats + iOS instructions
  const T2 = calcTotals();
  const info = document.getElementById('printingInfo');
  if (info) {
    const iOS = isIOSDevice();
    if (iOS) {
      info.innerHTML = `📄 ${state.clientName||'Quote'} · ${T2.totalArea.toFixed(1)} m²<br>
        <span style="font-size:9px;color:rgba(255,184,0,0.85)">⓵ 点击「打印」按钮 → ⓶ 在打印对话框「双指张开」缩略图 → ⓷ 分享 → 存到「文件」/邮件<br>Tap Print → pinch-zoom preview → Share → Save to Files</span>`;
    } else {
      info.innerHTML = `📄 ${state.clientName||'Quote'} · ${T2.totalArea.toFixed(1)} m² · ${T2.gross>0?fmt(T2.gross):'—'}<br>
        <span style="font-size:9px;color:rgba(232,237,242,0.5)">在打印对话框选择「保存为 PDF」即可导出 · Choose "Save as PDF" in print dialog · 必须勾选「背景图形」/ Enable "Background graphics"</span>`;
    }
  }

  // 3. Enter print mode — show #printRoot full-screen
  document.body.classList.add('printing');
  window.scrollTo(0, 0);

  // 4. On desktop with reliable window.print(), we can auto-trigger after a tick.
  //    On iOS, we let the user tap the toolbar "Print" button (more reliable).
  if (!isIOSDevice()) {
    // Desktop: show preview briefly then trigger print dialog
    setTimeout(() => {
      try {
        window.print();
      } catch(e) {
        console.warn('Print failed:', e);
      }
    }, 350);
  }
  // iOS: user must tap the Print button — window.print() is too unreliable to auto-call
}

function actuallyPrint() {
  try {
    window.print();
  } catch(e) {
    alert('打印失败 / Print failed: ' + e.message + '\n\n请使用 Safari 的「分享」→「打印」功能。\nPlease use Safari Share → Print menu.');
  }
}

function exitPrintMode() {
  document.body.classList.remove('printing');
  window.scrollTo(0, 0);
}

// Auto-exit print mode after the print dialog closes
window.addEventListener('afterprint', () => {
  setTimeout(() => exitPrintMode(), 100);
});

// ESC key exits print mode (desktop)
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('printing')) {
    exitPrintMode();
  }
});

function resetQuote() {
  if (!confirm(t('confirmReset'))) return;
  const keepMaterials = state.materials; // preserve user library across resets
  state = {
    tab: 0, style: null, tier: null,
    spaces: JSON.parse(JSON.stringify(DEFAULT_SPACES)),
    materials: keepMaterials || JSON.parse(JSON.stringify(DEFAULT_MATERIALS)),
    clientName: '', projectName: '',
    quoteRef: 'QQ-' + Date.now().toString(36).toUpperCase(),
    discount: 0, globalAdj: 0,
    paymentOverrides: {}, termsOverrides: {},
  };
  migrateState();
  renderAll();
}

// ─── Cache cleanup (fixes Vercel deployment showing stale cached version) ───
// Older versions of this app registered a Service Worker that aggressively
// cached old HTML. On HTTPS deployments (Vercel/Netlify), users could get
// stuck on an old version even after deploys. We now actively unregister
// any existing Service Worker and clear its caches so the latest build
// always loads.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister().catch(() => {}));
  }).catch(() => {});
}
if ('caches' in window) {
  caches.keys().then(keys => {
    keys.forEach(k => {
      if (k.startsWith('qvq-') || k.startsWith('qatar-')) {
        caches.delete(k).catch(() => {});
      }
    });
  }).catch(() => {});
}

// ─── Init ──────────────────────────────────────────────────────────────────────
loadState();
migrateState();
renderAll();
setInterval(saveState, 10000);
</script>
