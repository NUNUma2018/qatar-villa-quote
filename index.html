<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Qatar Quote"/>
<meta name="theme-color" content="#0D1F35"/>
<title>◈ Qatar Villa Quote v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy: #0D1F35;
  --navy2: #1A3A5C;
  --gold: #B88600;
  --gold2: #D4A017;
  --green: #2E6B4F;
  --cream: #E8EDF2;
  --muted: rgba(232,237,242,0.5);
  --dim: rgba(232,237,242,0.2);
  --glass: rgba(255,255,255,0.05);
  --glass2: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.09);
  --radius: 14px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; }
body { font-family: var(--font-body); background: var(--navy); color: var(--cream); min-height: 100vh; min-height: 100dvh; }

.bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 50% at 15% 15%, rgba(26,58,92,0.7) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 85%, rgba(184,134,0,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(46,107,79,0.08) 0%, transparent 70%); }
.bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px; }

/* ── Header ── */
header { position: sticky; top: 0; z-index: 200; background: rgba(13,31,53,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(184,134,0,0.25); padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-gem { font-size: 20px; color: var(--gold); }
.logo-text { line-height: 1.2; }
.logo-title { font-family: var(--font-display); font-size: 12px; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; }
.logo-sub { font-size: 9px; color: var(--muted); letter-spacing: 0.5px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Language toggle */
.lang-toggle {
  display: flex; border: 1px solid rgba(184,134,0,0.4); border-radius: 20px; overflow: hidden; flex-shrink: 0;
}
.lang-btn {
  padding: 4px 10px; font-size: 10px; font-weight: 700; cursor: pointer; border: none;
  background: transparent; color: var(--muted); font-family: var(--font-body); transition: all 0.2s; letter-spacing: 0.5px;
}
.lang-btn.active { background: var(--gold); color: #000; }

.save-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px;
  background: rgba(46,107,79,0.25); border: 1px solid rgba(46,107,79,0.5); color: #7EC8A0; }

/* Sync menu button */
.sync-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(184,134,0,0.4);
  background: rgba(184,134,0,0.1); color: var(--gold); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sync-btn:active { background: rgba(184,134,0,0.25); }

/* Sync modal */
.sync-modal-overlay {
  position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.sync-modal-overlay.show { display: flex; }
.sync-modal {
  background: linear-gradient(180deg, var(--navy2), var(--navy));
  border: 1px solid rgba(184,134,0,0.4); border-radius: 16px;
  width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}
.sync-modal-head {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.sync-modal-title { font-family: var(--font-display); font-size: 18px; color: var(--gold); font-weight: 700; }
.sync-close {
  width: 28px; height: 28px; border-radius: 50%; background: var(--glass2);
  border: 1px solid var(--border); color: var(--cream); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.sync-modal-body { padding: 14px 20px 20px; }
.sync-section { margin-bottom: 16px; }
.sync-section:last-child { margin-bottom: 0; }
.sync-section-title { font-size: 11px; color: var(--gold); letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
.sync-section-desc { font-size: 11px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.sync-action-btn {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--glass); color: var(--cream); font-family: var(--font-body); font-size: 13px;
  cursor: pointer; display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  transition: all 0.18s; text-align: left;
}
.sync-action-btn:hover, .sync-action-btn:active {
  border-color: var(--gold); background: rgba(184,134,0,0.12); color: var(--gold);
}
.sync-action-icon { font-size: 18px; flex-shrink: 0; }
.sync-action-text { flex: 1; }
.sync-action-name { font-size: 13px; font-weight: 600; }
.sync-action-sub { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.sync-file-input { display: none; }
.share-url-box {
  background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 10px; color: var(--cream); word-break: break-all;
  font-family: monospace; margin-top: 6px; max-height: 80px; overflow-y: auto;
}
.copy-feedback { font-size: 10px; color: #7EC8A0; margin-top: 4px; display: none; }
.copy-feedback.show { display: block; }

/* ── Nav ── */
.tab-nav { position: sticky; top: 56px; z-index: 190; background: rgba(13,31,53,0.92);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; scrollbar-width: none; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { flex: 1; min-width: 76px; padding: 8px 6px; background: none; border: none; cursor: pointer;
  color: var(--muted); font-family: var(--font-body); font-size: 10px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-btn .tab-icon { font-size: 15px; }
.tab-label-zh { display: block; }
.tab-label-en { display: block; font-size: 9px; opacity: 0.6; letter-spacing: 0.3px; }
.tab-num { width: 16px; height: 16px; border-radius: 50%; background: var(--navy2); border: 1px solid var(--border);
  font-size: 9px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.tab-btn.active .tab-num { background: var(--gold); border-color: var(--gold); color: #000; }
.tab-btn.done .tab-num { background: var(--green); border-color: var(--green); color: #fff; }

/* ── Main ── */
main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 24px 16px 130px; }
.page { animation: fadeSlide 0.25s ease; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.sec-head { margin-bottom: 20px; }
.sec-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; border-left: 3px solid var(--gold); padding-left: 12px; }
.sec-sub { font-size: 11px; color: var(--muted); margin-top: 4px; padding-left: 15px; }

/* ── Cards ── */
.card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.card-head { padding: 12px 18px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); color: var(--muted); display: flex; align-items: center; gap: 8px; }

/* ── Style selector ── */
.style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
.style-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 16px 12px; cursor: pointer;
  text-align: left; background: var(--glass); transition: all 0.22s; position: relative; overflow: hidden; }
.style-card:active { transform: scale(0.97); }
.style-card.selected { transform: translateY(-2px); }
.style-bar { width: 28px; height: 3px; border-radius: 2px; margin-bottom: 10px; }
.style-name { font-size: 13px; font-weight: 700; margin-bottom: 1px; }
.style-en { font-size: 9px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; }
.style-desc-zh { font-size: 10px; color: var(--muted); line-height: 1.5; margin-bottom: 2px; }
.style-desc-en { font-size: 9px; color: rgba(232,237,242,0.35); line-height: 1.5; margin-bottom: 8px; }
.style-mult { font-size: 11px; font-weight: 700; }
.check-badge { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; font-weight: 700; }

/* ── Tier ── */
.tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tier-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 18px 12px; cursor: pointer;
  text-align: center; background: var(--glass); transition: all 0.22s; position: relative; }
.tier-card:active { transform: scale(0.97); }
.tier-card.selected { transform: scale(1.03); }
.tier-icon { font-size: 26px; margin-bottom: 8px; }
.tier-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.tier-name-en { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.tier-note-zh { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
.tier-note-en { font-size: 9px; color: rgba(232,237,242,0.3); margin-bottom: 8px; }
.tier-mult { font-size: 18px; font-weight: 800; }
.rec-badge { margin-top: 8px; font-size: 9px; padding: 3px 8px; border-radius: 20px; display: inline-block; }
@media (max-width: 480px) {
  .tier-grid { grid-template-columns: 1fr; }
  .tier-card { display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px; }
  .tier-icon { font-size: 22px; margin: 0; flex-shrink: 0; }
}

/* ── Info boxes ── */
.info-box { background: rgba(184,134,0,0.1); border: 1px solid rgba(184,134,0,0.3); border-radius: 10px;
  padding: 12px 14px; font-size: 12px; color: rgba(255,255,255,0.75); line-height: 1.6; margin-bottom: 18px; }
.warn-box { background: rgba(180,60,60,0.1); border: 1px solid rgba(180,60,60,0.3); border-radius: 10px;
  padding: 12px 14px; font-size: 12px; color: rgba(255,180,180,0.85); line-height: 1.6; margin-bottom: 18px; }

/* ── Space list ── */
.space-list { display: flex; flex-direction: column; gap: 8px; }
.space-row { display: flex; align-items: center; gap: 8px; background: var(--glass2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px; transition: border-color 0.2s; flex-wrap: wrap; }
.space-row.has-value { border-color: rgba(184,134,0,0.35); }
.space-icon { font-size: 18px; width: 26px; text-align: center; flex-shrink: 0; }
.space-info { flex: 1; min-width: 90px; }
.space-name { font-size: 12px; font-weight: 600; }
.space-name-en { font-size: 9px; color: rgba(232,237,242,0.4); margin-top: 1px; }
.space-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

.space-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: nowrap; }
.space-input { width: 64px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18);
  border-radius: 8px; color: var(--cream); font-size: 14px; font-weight: 700; padding: 6px 6px;
  text-align: center; outline: none; font-family: var(--font-body); transition: border-color 0.2s; }
.space-input:focus { border-color: var(--gold); }
.space-unit { font-size: 11px; color: var(--muted); }

/* Base price edit */
.base-price-wrap { display: flex; align-items: center; gap: 3px; }
.base-price-input { width: 56px; background: rgba(184,134,0,0.1); border: 1px solid rgba(184,134,0,0.3);
  border-radius: 6px; color: var(--gold); font-size: 10px; font-weight: 700; padding: 3px 5px;
  text-align: center; outline: none; font-family: var(--font-body); transition: border-color 0.2s; }
.base-price-input:focus { border-color: var(--gold); background: rgba(184,134,0,0.2); }
.base-price-label { font-size: 9px; color: rgba(184,134,0,0.6); white-space: nowrap; }

.space-cost { font-size: 11px; color: var(--gold); font-weight: 700; min-width: 88px; text-align: right; flex-shrink: 0; }
.space-del { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,80,80,0.3);
  background: rgba(255,80,80,0.1); color: rgba(255,150,150,0.8); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; transition: all 0.2s; }
.space-del:hover { background: rgba(255,80,80,0.25); }

/* Area quick buttons */
.area-quick { display: flex; gap: 3px; flex-shrink: 0; }
.area-quick-btn { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--glass); color: var(--cream); cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; font-weight: 700; }
.area-quick-btn:active { background: rgba(184,134,0,0.2); }

/* ── Add spaces ── */
.add-section { margin-top: 20px; }
.add-section-title { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
.add-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.add-btn { background: var(--glass); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; color: var(--muted); font-size: 11px; font-family: var(--font-body);
  transition: all 0.18s; white-space: nowrap; }
.add-btn:hover, .add-btn:active { background: var(--glass2); border-color: var(--gold); color: var(--gold); }
.custom-add { display: flex; gap: 8px; margin-top: 12px; }
.custom-input { flex: 1; background: var(--glass); border: 1px solid var(--border); border-radius: 8px;
  color: var(--cream); font-size: 12px; padding: 8px 12px; outline: none; font-family: var(--font-body); }
.custom-input:focus { border-color: var(--gold); }
.custom-confirm { background: var(--gold); border: none; border-radius: 8px; padding: 8px 16px; color: #000; font-weight: 700; cursor: pointer; font-size: 12px; }

.area-summary { margin-top: 14px; padding: 12px 16px; background: rgba(184,134,0,0.08);
  border: 1px solid rgba(184,134,0,0.2); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
.area-label { font-size: 12px; color: var(--muted); }
.area-val { font-size: 16px; font-weight: 800; color: var(--gold); }

/* ── Quote ── */
.client-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.client-field { flex: 1; min-width: 180px; }
.client-label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 4px; letter-spacing: 0.5px; }
.client-input { width: 100%; background: var(--glass2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--cream); font-size: 13px; padding: 9px 12px; outline: none; font-family: var(--font-body); }
.client-input:focus { border-color: var(--gold); }

.quote-card { background: var(--glass); border: 1px solid rgba(184,134,0,0.3); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.quote-header-band { background: linear-gradient(90deg, var(--navy2), #0a1826); padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; }
.quote-htitle { font-family: var(--font-display); font-size: 18px; color: var(--gold); font-weight: 700; }
.quote-hmeta { font-size: 10px; color: var(--muted); margin-top: 4px; line-height: 1.7; }
.quote-hdate { font-size: 11px; color: var(--muted); text-align: right; }

.price-band { padding: 24px 20px; text-align: center; background: linear-gradient(135deg, rgba(26,58,92,0.5), rgba(184,134,0,0.08)); border-bottom: 1px solid var(--border); }
.price-label { font-size: 10px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
.price-range { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.price-low { font-size: 20px; font-weight: 300; color: rgba(232,237,242,0.7); }
.price-sep { font-size: 18px; color: var(--gold); }
.price-high { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--gold); }
.price-note { margin-top: 10px; font-size: 11px; color: rgba(255,184,0,0.65); }
.price-sqm { margin-top: 4px; font-size: 11px; color: var(--muted); }

/* Manual price override in quote */
.manual-override { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 10px 16px;
  background: rgba(255,255,255,0.04); border-radius: 10px; flex-wrap: wrap; justify-content: center; }
.manual-override-label { font-size: 11px; color: var(--muted); }
.manual-discount { display: flex; gap: 6px; flex-wrap: wrap; }
.disc-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--glass);
  color: var(--muted); font-size: 10px; cursor: pointer; font-family: var(--font-body); transition: all 0.18s; }
.disc-btn.active { background: rgba(46,107,79,0.25); border-color: rgba(46,107,79,0.5); color: #7EC8A0; font-weight: 700; }
.disc-btn.disc-neg { }
.disc-btn.disc-neg.active { background: rgba(180,60,60,0.2); border-color: rgba(180,60,60,0.4); color: rgba(255,150,150,0.9); }

.breakdown-wrap { padding: 16px 20px; }
.breakdown-title { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
.b-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
.b-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
.b-label { font-size: 11px; color: rgba(232,237,242,0.65); flex: 1; min-width: 140px; }
.b-bar { flex: 2; height: 5px; background: rgba(255,255,255,0.07); border-radius: 3px; min-width: 60px; overflow: hidden; }
.b-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
.b-pct { font-size: 10px; color: var(--muted); width: 30px; text-align: right; }
.b-val { font-size: 11px; font-weight: 700; color: var(--cream); min-width: 100px; text-align: right; }
.b-total { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 6px; font-size: 13px; font-weight: 700; }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 480px; }
th { background: rgba(26,58,92,0.7); color: var(--muted); padding: 8px 10px; text-align: left; font-weight: 600;
  border-bottom: 2px solid rgba(184,134,0,0.3); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--cream); }
tr:last-child td { border-bottom: none; }

/* ── Payment ── */
.pay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.pay-card { background: var(--glass); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.pay-head { padding: 6px 12px; font-size: 11px; font-weight: 700; color: #fff; }
.pay-amount { padding: 10px 12px 2px; font-size: 15px; font-weight: 800; color: var(--gold); }
.pay-pct { font-size: 11px; color: var(--muted); font-weight: 400; }
.pay-trigger { padding: 0 12px 2px; font-size: 10px; color: var(--muted); }
.pay-trigger-en { padding: 0 12px 3px; font-size: 9px; color: rgba(232,237,242,0.25); }
.pay-products { padding: 0 12px 10px; font-size: 10px; color: rgba(255,255,255,0.35); }

.disc { padding: 8px 12px; margin-bottom: 7px; font-size: 11px; color: rgba(255,255,255,0.5);
  line-height: 1.65; background: rgba(255,255,255,0.03); border-radius: 0 6px 6px 0; }

/* ── Bottom bar ── */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: rgba(13,31,53,0.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(184,134,0,0.25);
  padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: space-between; }

/* ═══════════════════════════════════════════════════════════════════════════
   PRINT CONTAINER — hidden by default; shown via #printRoot.show class.
   When shown, it COVERS THE ENTIRE SCREEN. This is the only reliable way
   to make iOS Safari + Mac Safari print the right content with backgrounds.
   ═══════════════════════════════════════════════════════════════════════════ */

#printRoot {
  display: none;
  background: #0D1F35;
  color: #E8EDF2;
  font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif;
}

/* When in "print preview" mode (shown on screen), cover the entire viewport */
body.printing #printRoot {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 99999;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0;
}
body.printing > *:not(#printRoot):not(.printing-toolbar) {
  display: none !important;
}

/* Make each page look like a printed A4 page during preview */
body.printing #printRoot .pr-page {
  width: 100%;
  max-width: 210mm;
  margin: 0 auto 12px;
  padding: 12mm 10mm;
  background: #0D1F35;
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  min-height: 270mm;
  box-sizing: border-box;
}
body.printing #printRoot .pr-page:first-child { margin-top: 80px; }
body.printing #printRoot .pr-page:last-child { margin-bottom: 60px; }

/* Print preview toolbar (shown on top when in print mode) */
.printing-toolbar {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100000;
  background: rgba(13,31,53,0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 10px 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  border-bottom: 1px solid rgba(184,134,0,0.4);
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
body.printing .printing-toolbar { display: flex; }
.printing-toolbar-info {
  font-size: 11px; color: rgba(232,237,242,0.6); flex: 1; min-width: 100px;
}
.printing-toolbar-btns { display: flex; gap: 6px; flex-shrink: 0; }
.printing-btn {
  padding: 8px 14px; border-radius: 8px; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
}
.printing-btn-print {
  background: linear-gradient(135deg, #1A3A5C, #B88600);
  color: #fff;
}
.printing-btn-close {
  background: rgba(255,255,255,0.1); color: #E8EDF2;
  border: 1px solid rgba(255,255,255,0.2);
}

#printRoot * {
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
  color-adjust: exact !important;
}

/* ═══════════════════════════════════════════════════════════════════════════
   @media print rules — applied when user actually invokes print
   ═══════════════════════════════════════════════════════════════════════════ */
@media print {
  @page {
    size: A4 portrait;
    margin: 0;
  }

  /* CRITICAL: force backgrounds to print */
  html, body, * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }

  html { background: #0D1F35 !important; margin: 0 !important; padding: 0 !important; }
  body {
    background: #0D1F35 !important;
    color: #E8EDF2 !important;
    margin: 0 !important;
    padding: 0 !important;
    min-height: 0 !important;
  }

  /* Hide all non-print UI completely */
  header, .tab-nav, .bottom-bar, .bg-layer, .bg-grid,
  #mainContent, .sync-modal-overlay, .printing-toolbar {
    display: none !important;
  }

  /* Print root takes over the whole page */
  #printRoot {
    display: block !important;
    position: static !important;
    width: 100% !important;
    background: #0D1F35 !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: visible !important;
    box-shadow: none !important;
  }

  /* Page breaks — reset preview-only screen styling */
  .pr-page {
    page-break-after: always;
    background: #0D1F35 !important;
    padding: 10mm !important;
    margin: 0 !important;
    max-width: none !important;
    width: 100% !important;
    box-shadow: none !important;
    min-height: 0 !important;
  }
  body.printing #printRoot .pr-page:first-child { margin-top: 0 !important; }
  body.printing #printRoot .pr-page:last-child { margin-bottom: 0 !important; }
  .pr-page:last-child, .pr-page.no-break-after { page-break-after: auto; }
  .pr-card, .pr-pay-card, .pr-b-row { page-break-inside: avoid; }
  .pr-header, .pr-client-row, .pr-price-band { page-break-inside: avoid; }
}

      if (decoded && decoded.spaces) {

// CSV Export — Numbers/Pages/Excel friendly (UTF-8 BOM for Excel)
function exportCSV() {
  const sm = STYLES[state.style]?.mult||1;
  const tm = TIERS[state.tier]?.mult||1;
  const sLabel = STYLES[state.style]?.label||'';
  const tLabel = TIERS[state.tier]?.label||'';

  let csv = '\uFEFF'; // UTF-8 BOM for Numbers/Excel
  csv += `"Qatar Villa Quote","${state.quoteRef}","${state.clientName}","${state.projectName}"\n`;
  csv += `"Style 风格","${sLabel}","Grade 材料","${tLabel}"\n`;
  csv += '\n';
  csv += '"Icon","Space 空间","Name EN","Name AR","Area m²","Base QAR/m²","Style Mult","Tier Mult","Material Cost","Logistics","Overhead","Contingency","Subtotal QAR"\n';

  state.spaces.forEach(sp => {
    const c = calcSpace(sp);
    csv += `"${sp.icon}","${sp.name}","${sp.nameEn||''}","${sp.nameAr||''}",${c.area},${sp.base},${sm},${tm},${Math.round(c.mat)},${Math.round(c.log)},${Math.round(c.oh)},${Math.round(c.con)},${Math.round(c.total)}\n`;
  });

  const T2 = calcTotals();
  csv += '\n';
  csv += `"TOTALS","","","",${T2.totalArea.toFixed(1)},"","","",${Math.round(T2.totalMat)},${Math.round(T2.totalLog)},${Math.round(T2.totalOH)},${Math.round(T2.totalCon)},${Math.round(T2.gross)}\n`;
  csv += `"Price Range Low (QAR)","${Math.round(T2.low)}"\n`;
  csv += `"Price Range High (QAR)","${Math.round(T2.high)}"\n`;
  csv += `"Discount Applied","${(state.discount*100).toFixed(0)}%"\n`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const filename = `QVQ_${(state.clientName||'quote').replace(/\s+/g,'_')}_${Date.now()}.csv`;
  triggerDownload(blob, filename);
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function handleFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const text = e.target.result;
      let imported;
      if (file.name.toLowerCase().endsWith('.csv')) {
        imported = parseCSV(text);
      } else {
        imported = JSON.parse(text);
      }
      if (imported && imported.spaces) {
        state = { ...state, ...imported };
        renderAll();
        alert(t('syncImported'));
        closeSyncModal();
      } else {
        throw new Error('Invalid file format');
      }
    } catch (err) {
      alert(t('syncImportFailed') + err.message);
    }
    event.target.value = ''; // allow same file re-pick
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text) {
  // Simple CSV importer for the format we export
  // Returns a partial state object with spaces array
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
  const spaces = [];
  let inDataSection = false;
  let clientName = '', projectName = '', quoteRef = '';
  let style = null, tier = null;
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = parseCSVLine(line);
    if (cols[0] === 'Qatar Villa Quote') {
      quoteRef = cols[1] || '';
      clientName = cols[2] || '';
      projectName = cols[3] || '';
    } else if (cols[0] && cols[0].startsWith('Style')) {
      const sLabel = cols[1];
      const tLabel = cols[3];
      for (const [k,v] of Object.entries(STYLES)) if (v.label===sLabel||v.en===sLabel) style = k;
      for (const [k,v] of Object.entries(TIERS)) if (v.label===tLabel||v.en===tLabel) tier = k;
    } else if (cols[0] === 'Icon') {
      inDataSection = true;
    } else if (inDataSection && cols[0] && cols[0]!=='TOTALS' && cols[0]!=='Price Range Low (QAR)' && cols[0]!=='Price Range High (QAR)' && cols[0]!=='Discount Applied') {
      const area = parseFloat(cols[4]) || 0;
      const base = parseFloat(cols[5]) || 350;
      spaces.push({
        id: 'sp_'+Math.random().toString(36).slice(2,8),
        icon: cols[0] || '🏠',
        name: cols[1] || 'Space',
        nameEn: cols[2] || cols[1],
        nameAr: cols[3] || '',
        base: base,
        items: '', itemsEn: '',
        qty: 1,
        area: area > 0 ? area.toString() : ''
      });
    }
  }
  return { spaces, clientName, projectName, quoteRef, style, tier };
}

function parseCSVLine(line) {
  const result = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
    else if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(cur); cur = ''; }
    else cur += ch;
  }
  result.push(cur);
  return result;
}

// ─── Calculations ──────────────────────────────────────────────────────────────
function calcSpace(sp) {
  const area = parseFloat(sp.area) || 0;
  const sm = STYLES[state.style]?.mult || 1;
  const tm = TIERS[state.tier]?.mult || 1;
  const discMult = 1 + (state.discount || 0);
  const mat = area * sp.base * sm * tm * discMult;
  const log = mat * LOGISTICS_RATE;
  const oh  = mat * OVERHEAD;
  const con = mat * CONTINGENCY;
  return { area, mat, log, oh, con, total: mat+log+oh+con };
}

function calcTotals() {
  const rows = state.spaces.map(calcSpace).filter(r=>r.area>0);
  const totalArea = rows.reduce((a,r)=>a+r.area,0);
  const totalMat  = rows.reduce((a,r)=>a+r.mat,0);
  const totalLog  = rows.reduce((a,r)=>a+r.log,0);
  const totalOH   = rows.reduce((a,r)=>a+r.oh,0);
  const totalCon  = rows.reduce((a,r)=>a+r.con,0);
  const gross     = totalMat+totalLog+totalOH+totalCon;
  return { rows, totalArea, totalMat, totalLog, totalOH, totalCon, gross,
           low: gross*0.92, high: gross*1.18 };
}

function fmt(n) { return 'QAR ' + Math.round(n).toLocaleString('en-US'); }
function pct(n) { return (n*100).toFixed(0)+'%'; }
function uid() { return 'sp_'+Math.random().toString(36).slice(2,8); }

    const done = (i===0&&state.style)||(i===1&&state.tier)||(i===2&&state.spaces.some(s=>parseFloat(s.area)>0));
    b.classList.toggle('done', done && i!==state.tab);
    const num = document.getElementById('tn'+i);
    if (num) num.textContent = done && i!==state.tab ? '✓' : i+1;
  });
}

      <div class="style-name">${lang==='en'?s.en:s.label}</div>

      <div class="style-desc-en en-only">${s.descEn}</div>

function selectStyle(k) { state.style=k; renderAll(); }

// ─── Page 1: Tier ──────────────────────────────────────────────────────────────
function renderTier() {
  let cards = Object.entries(TIERS).map(([k,tier]) => {
    const sel = state.tier===k;
    return `<div class="tier-card${sel?' selected':''}" onclick="selectTier('${k}')"

function selectTier(k) { state.tier=k; renderAll(); }

// ─── Page 2: Spaces ────────────────────────────────────────────────────────────
function renderSpaces() {
  const rows = state.spaces.map((sp,i) => {
    const calc = calcSpace(sp);
    const hasVal = calc.area > 0;
    const spaceName = lang==='en' ? (sp.nameEn||sp.name) : sp.name;
    const spaceAlt  = lang==='en' ? sp.name : (sp.nameEn||'');
    const itemsStr  = lang==='en' ? (sp.itemsEn||sp.items) : sp.items;
    return `<div class="space-row${hasVal?' has-value':''}" id="row_${sp.id}">
      <span class="space-icon">${sp.icon}</span>
      <div class="space-info">
        <div class="space-name">${spaceName}</div>
        ${spaceAlt?`<div class="space-name-en">${spaceAlt}</div>`:''}
        <div class="space-sub">${itemsStr}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
        <div class="space-controls">
          <div class="area-quick">
            <button class="area-quick-btn" onclick="adjustArea('${sp.id}',-5)" title="-5">−</button>
            <button class="area-quick-btn" onclick="adjustArea('${sp.id}',5)" title="+5">+</button>
          </div>
          <input class="space-input" type="number" min="0" placeholder="0"
            value="${sp.area}"
            onchange="updateArea('${sp.id}',this.value)"
            oninput="updateArea('${sp.id}',this.value)"
            inputmode="decimal"/>
          <span class="space-unit">m²</span>
        </div>
        <div class="base-price-wrap">
          <input class="base-price-input" type="number" min="50" max="5000"
            value="${sp.base}"
            onchange="updateBase('${sp.id}',this.value)"
            oninput="updateBase('${sp.id}',this.value)"
            inputmode="decimal" title="Base rate QAR/m²"/>
          <span class="base-price-label">QAR/m²</span>
        </div>
      </div>
      ${(state.style&&state.tier&&hasVal)?`<div class="space-cost">${fmt(calc.total)}</div>`:`<div class="space-cost" style="color:var(--muted);font-size:10px">${sp.base} QAR/m²</div>`}
      <button class="space-del" onclick="deleteSpace('${sp.id}')" title="删除 Delete">×</button>
    </div>`;
  }).join('');

  const presets = ADD_PRESETS.filter(p => !state.spaces.find(s=>s.nameEn===p.nameEn));
  const presetBtns = presets.map(p => {
    const label = lang==='en' ? p.nameEn : p.name;
    return `<button class="add-btn" onclick="addPreset('${encodeURIComponent(JSON.stringify(p))}')">${p.icon} ${label}</button>`;
  }).join('');

  const totalArea = state.spaces.reduce((a,sp)=>a+(parseFloat(sp.area)||0),0);

  return `<div class="page">
    <div class="sec-head">
      <div class="sec-title">${t('areaTitle')}</div>
      <div class="sec-sub">${t('areaSub')}</div>
    </div>
    ${(!state.style||!state.tier)?`<div class="warn-box">${t('areaWarn')}</div>`:''}
    <div class="space-list">${rows}</div>
    ${totalArea>0?`<div class="area-summary"><span class="area-label">${t('areaTotal')}</span><span class="area-val">${totalArea.toFixed(1)} m²</span></div>`:''}
    <div class="add-section">
      <div class="add-section-title">${t('addMore')}</div>
      <div class="add-grid">${presetBtns}</div>
      <div class="custom-add mt12">
        <input class="custom-input" id="customSpaceName" placeholder="${t('customPlaceholder')}"/>
        <button class="custom-confirm" onclick="addCustomSpace()">${t('addBtn')}</button>
      </div>
    </div>
  </div>`;
}

function updateArea(id, val) {
  const sp = state.spaces.find(s=>s.id===id);
  if (sp) { sp.area = val; saveState(); updateSaveBadge(false); renderPrintRoot(); }
}
function adjustArea(id, delta) {
  const sp = state.spaces.find(s=>s.id===id);
  if (sp) { const cur = parseFloat(sp.area)||0; sp.area = Math.max(0, cur+delta).toString(); renderAll(); }
}
function updateBase(id, val) {
  const sp = state.spaces.find(s=>s.id===id);
  if (sp) { sp.base = Math.max(50, parseFloat(val)||50); saveState(); updateSaveBadge(false); renderPrintRoot(); }
}
function deleteSpace(id) { state.spaces = state.spaces.filter(s=>s.id!==id); renderAll(); }
function addPreset(encoded) {
  const p = JSON.parse(decodeURIComponent(encoded));
  state.spaces.push({ id:uid(), icon:p.icon, name:p.name, nameEn:p.nameEn, nameAr:p.nameAr||p.nameEn, base:p.base,
    items:p.nameEn, itemsEn:p.nameEn, qty:1, area:'' });
  renderAll();
}
function addCustomSpace() {
  const inp = document.getElementById('customSpaceName');
  const name = inp?.value.trim();
  if (!name) return;
  state.spaces.push({ id:uid(), icon:'🏠', name, nameEn:name, base:350, items:'自定义 Custom', itemsEn:'Custom Space', qty:1, area:'' });
  renderAll();
}

  state.discount = val;

}

// ─── Main render ───────────────────────────────────────────────────────────────
function renderMain() {
  const el = document.getElementById('mainContent');
  let html = '';
  switch(state.tab) {
    case 0: html = renderStyle(); break;
    case 1: html = renderTier(); break;
    case 2: html = renderSpaces(); break;
    case 3: html = renderQuote(); break;
  }
  el.innerHTML = html;
}

function renderBottom() {
  const el = document.getElementById('bottomBar');
  const tab = state.tab;
  const hasSpaces = state.spaces.some(s=>parseFloat(s.area)>0);
  const canNext = (tab===0&&state.style)||(tab===1&&state.tier)||(tab===2&&hasSpaces);

  if (tab === 3) {
    el.innerHTML = `
      <button class="btn-back" onclick="goTab(2)">${t('backBtn')}</button>
      <button class="btn-reset" onclick="resetQuote()">${t('newQuote')}</button>
      <button class="btn-print" onclick="doPrint()">${t('printBtn')}</button>`;
  } else {
    el.innerHTML = `
      ${tab>0?`<button class="btn-back" onclick="goTab(${tab-1})">${t('prevStep')}</button>`:'<div></div>'}
      <button class="btn-next" ${canNext?'':'disabled'} onclick="goTab(${tab+1})">
        ${tab===2?t('genQuote'):t('nextStep')}
      </button>`;
  }
}

// ─── Print flow (iOS Safari + Mac Safari + Chrome compatible) ─────────────────
// Strategy:
//   1. Click "Print" → enter print preview mode (full-screen overlay)
//   2. User sees the EXACT print output filling their screen, can scroll all 3 pages
//   3. Click "Print" in toolbar → calls window.print()
//   4. After print or cancel, exit preview mode
//
// This works around iOS Safari's print() unreliability AND solves the "only
// prints visible part" problem because the print content IS the only thing
// rendered when print() is called.

function isIOSDevice() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function doPrint() {
  // 1. Re-render print root with latest data
  renderPrintRoot();

  // 2. Update toolbar with stats + iOS instructions
  const T2 = calcTotals();
  const info = document.getElementById('printingInfo');
  if (info) {
    const iOS = isIOSDevice();
    if (iOS) {
      info.innerHTML = `📄 ${state.clientName||'Quote'} · ${T2.totalArea.toFixed(1)} m²<br>
        <span style="font-size:9px;color:rgba(255,184,0,0.85)">⓵ 点击「打印」按钮 → ⓶ 在打印对话框「双指张开」缩略图 → ⓷ 分享 → 存到「文件」/邮件<br>Tap Print → pinch-zoom preview → Share → Save to Files</span>`;
    } else {
      info.innerHTML = `📄 ${state.clientName||'Quote'} · ${T2.totalArea.toFixed(1)} m² · ${T2.gross>0?fmt(T2.gross):'—'}<br>
        <span style="font-size:9px;color:rgba(232,237,242,0.5)">在打印对话框选择「保存为 PDF」即可导出 · Choose "Save as PDF" in print dialog · 必须勾选「背景图形」/ Enable "Background graphics"</span>`;
    }
  }

  // 3. Enter print mode — show #printRoot full-screen
  document.body.classList.add('printing');
  window.scrollTo(0, 0);

  // 4. On desktop with reliable window.print(), we can auto-trigger after a tick.
  //    On iOS, we let the user tap the toolbar "Print" button (more reliable).
  if (!isIOSDevice()) {
    // Desktop: show preview briefly then trigger print dialog
    setTimeout(() => {
      try {
        window.print();
      } catch(e) {
        console.warn('Print failed:', e);
      }
    }, 350);
  }
  // iOS: user must tap the Print button — window.print() is too unreliable to auto-call
}

function actuallyPrint() {
  try {
    window.print();
  } catch(e) {
    alert('打印失败 / Print failed: ' + e.message + '\n\n请使用 Safari 的「分享」→「打印」功能。\nPlease use Safari Share → Print menu.');
  }
}

function exitPrintMode() {
  document.body.classList.remove('printing');
  window.scrollTo(0, 0);
}

// Auto-exit print mode after the print dialog closes
window.addEventListener('afterprint', () => {
  setTimeout(() => exitPrintMode(), 100);
});

// ESC key exits print mode (desktop)
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('printing')) {
    exitPrintMode();
  }
});

function resetQuote() {
  if (!confirm(t('confirmReset'))) return;
  state = {
    tab: 0, style: null, tier: null,
    spaces: JSON.parse(JSON.stringify(DEFAULT_SPACES)),
    clientName: '', projectName: '',
    quoteRef: 'QQ-' + Date.now().toString(36).toUpperCase(),
    discount: 0, globalAdj: 0,
  };
  renderAll();
}

// ─── PWA ──────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `const CACHE='qvq-v3';const URLS=[self.location.pathname];self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ─── Init ──────────────────────────────────────────────────────────────────────
loadState();
renderAll();
setInterval(saveState, 10000);
</script>
