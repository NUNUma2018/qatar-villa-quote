<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Qatar Quote"/>
<meta name="theme-color" content="#0D1F35"/>
<title>◈ Qatar Villa Quote v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy: #0D1F35;
  --navy2: #1A3A5C;
  --gold: #D4A017;
  --gold-deep: #B88600;
  --green: #2E6B4F;
  --cream: #F0F4F8;             /* 提亮：原 #E8EDF2 */
  --muted: rgba(240,244,248,0.72);  /* 提亮：原 0.5 */
  --dim: rgba(240,244,248,0.4);
  --glass: rgba(255,255,255,0.06);
  --glass2: rgba(255,255,255,0.10);
  --border: rgba(255,255,255,0.14);   /* 加深 */
  --radius: 14px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; }
body { font-family: var(--font-body); background: var(--navy); color: var(--cream);
  min-height: 100vh; min-height: 100dvh; font-size: 15px;  /* 整体字号 +1 */ }

.bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 50% at 15% 15%, rgba(26,58,92,0.7) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 85%, rgba(212,160,23,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(46,107,79,0.08) 0%, transparent 70%); }
.bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px; }

/* ── Header ── */
header { position: sticky; top: 0; z-index: 200; background: rgba(13,31,53,0.94);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(212,160,23,0.3); padding: 11px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-gem { font-size: 22px; color: var(--gold); }
.logo-text { line-height: 1.2; }
.logo-title { font-family: var(--font-display); font-size: 13px; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; }
.logo-sub { font-size: 10px; color: var(--muted); letter-spacing: 0.5px; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Language toggle */
.lang-toggle { display: flex; border: 1px solid rgba(212,160,23,0.45); border-radius: 20px; overflow: hidden; flex-shrink: 0; }
.lang-btn { padding: 5px 11px; font-size: 11px; font-weight: 700; cursor: pointer; border: none;
  background: transparent; color: var(--muted); font-family: var(--font-body); transition: all 0.2s; letter-spacing: 0.5px; }
.lang-btn.active { background: var(--gold); color: #000; }

.save-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px;
  background: rgba(46,107,79,0.25); border: 1px solid rgba(46,107,79,0.5); color: #8FD4A8; font-weight: 600; }

/* ── Nav ── */
.tab-nav { position: sticky; top: 56px; z-index: 190; background: rgba(13,31,53,0.94);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; scrollbar-width: none; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { flex: 1; min-width: 76px; padding: 10px 6px; background: none; border: none; cursor: pointer;
  color: var(--muted); font-family: var(--font-body); font-size: 11px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; font-weight: 500; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 700; }
.tab-btn .tab-icon { font-size: 16px; }
.tab-label-zh, .tab-label-en { display: block; }
.tab-label-en { font-size: 10px; opacity: 0.7; letter-spacing: 0.3px; }
.tab-num { width: 17px; height: 17px; border-radius: 50%; background: var(--navy2); border: 1px solid var(--border);
  font-size: 10px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; }
.tab-btn.active .tab-num { background: var(--gold); border-color: var(--gold); color: #000; }
.tab-btn.done .tab-num { background: var(--green); border-color: var(--green); color: #fff; }

/* ── Main ── */
main { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 22px 16px 130px; }
.page { animation: fadeSlide 0.22s ease; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.sec-head { margin-bottom: 18px; }
.sec-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; border-left: 3px solid var(--gold); padding-left: 13px; color: var(--cream); }
.sec-sub { font-size: 12px; color: var(--muted); margin-top: 5px; padding-left: 16px; }

/* ── Cards ── */
.card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.card-head { padding: 13px 18px; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--border); color: var(--cream); display: flex; align-items: center; gap: 8px; background: rgba(26,58,92,0.4); }

/* ── Style selector ── */
.style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 12px; }
.style-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 16px 13px; cursor: pointer;
  text-align: left; background: var(--glass); transition: all 0.22s; position: relative; overflow: hidden; }
.style-card:active { transform: scale(0.97); }
.style-card.selected { transform: translateY(-2px); }
.style-bar { width: 30px; height: 3px; border-radius: 2px; margin-bottom: 11px; }
.style-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; color: var(--cream); }
.style-en { font-size: 10px; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.5px; }
.style-desc-zh { font-size: 11px; color: var(--muted); line-height: 1.55; margin-bottom: 3px; }
.style-desc-en { font-size: 10px; color: rgba(240,244,248,0.45); line-height: 1.55; margin-bottom: 9px; }
.style-mult { font-size: 12px; font-weight: 700; }
.check-badge { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; font-weight: 700; }

/* ── Tier ── */
.tier-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.tier-card { border: 2px solid var(--border); border-radius: var(--radius); padding: 18px 13px; cursor: pointer;
  text-align: center; background: var(--glass); transition: all 0.22s; position: relative; }
.tier-card:active { transform: scale(0.97); }
.tier-card.selected { transform: scale(1.03); }
.tier-icon { font-size: 28px; margin-bottom: 8px; }
.tier-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.tier-name-en { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
.tier-note-zh { font-size: 11px; color: var(--muted); margin-bottom: 2px; line-height: 1.5; }
.tier-note-en { font-size: 10px; color: rgba(240,244,248,0.45); margin-bottom: 9px; line-height: 1.5; }
.tier-mult { font-size: 19px; font-weight: 800; }
.rec-badge { margin-top: 8px; font-size: 10px; padding: 3px 9px; border-radius: 20px; display: inline-block; font-weight: 600; }
@media (max-width: 480px) {
  .tier-grid { grid-template-columns: 1fr; }
  .tier-card { display: flex; align-items: center; gap: 14px; text-align: left; padding: 13px; }
  .tier-icon { font-size: 24px; margin: 0; flex-shrink: 0; }
}

/* ── Brand panel (NEW) ── */
.brand-panel { background: rgba(46,107,79,0.08); border: 1px solid rgba(46,107,79,0.3);
  border-radius: 12px; padding: 14px 16px; margin-top: 18px; }
.brand-panel-title { font-size: 13px; font-weight: 700; color: #8FD4A8; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.brand-cat { margin-bottom: 14px; }
.brand-cat-name { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; font-weight: 600; }
.brand-list { display: flex; flex-wrap: wrap; gap: 6px; }
.brand-tag { font-size: 11px; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12); color: var(--cream); }
.brand-tag.luxury { background: rgba(212,160,23,0.15); border-color: rgba(212,160,23,0.4); color: var(--gold); }
.brand-tag.premium { background: rgba(74,158,191,0.15); border-color: rgba(74,158,191,0.4); color: #82C8E0; }
.brand-tag.standard { background: rgba(120,140,160,0.12); border-color: rgba(120,140,160,0.3); color: var(--cream); }

/* ── Info boxes ── */
.info-box { background: rgba(212,160,23,0.12); border: 1px solid rgba(212,160,23,0.35); border-radius: 10px;
  padding: 12px 15px; font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.65; margin-bottom: 18px; }
.warn-box { background: rgba(180,60,60,0.12); border: 1px solid rgba(180,60,60,0.35); border-radius: 10px;
  padding: 12px 15px; font-size: 13px; color: rgba(255,180,180,0.95); line-height: 1.65; margin-bottom: 18px; }

/* ── Space list ── */
.space-list { display: flex; flex-direction: column; gap: 9px; }
.space-row { display: flex; align-items: center; gap: 9px; background: var(--glass2); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 13px; transition: border-color 0.2s; flex-wrap: wrap; }
.space-row.has-value { border-color: rgba(212,160,23,0.4); }
.space-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.space-info { flex: 1; min-width: 100px; }
.space-name { font-size: 13px; font-weight: 700; color: var(--cream); }
.space-name-en { font-size: 10px; color: var(--dim); margin-top: 1px; }
.space-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

.space-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: nowrap; }
.space-input { width: 70px; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.22);
  border-radius: 8px; color: var(--cream); font-size: 15px; font-weight: 700; padding: 7px 6px;
  text-align: center; outline: none; font-family: var(--font-body); transition: border-color 0.2s; }
.space-input:focus { border-color: var(--gold); background: rgba(255,255,255,0.14); }
.space-unit { font-size: 12px; color: var(--muted); font-weight: 600; }

/* Base price edit */
.base-price-wrap { display: flex; align-items: center; gap: 4px; }
.base-price-input { width: 64px; background: rgba(212,160,23,0.12); border: 1px solid rgba(212,160,23,0.35);
  border-radius: 6px; color: var(--gold); font-size: 11px; font-weight: 700; padding: 4px 5px;
  text-align: center; outline: none; font-family: var(--font-body); transition: border-color 0.2s; }
.base-price-input:focus { border-color: var(--gold); background: rgba(212,160,23,0.22); }
.base-price-label { font-size: 10px; color: rgba(212,160,23,0.75); white-space: nowrap; font-weight: 600; }

.space-cost { font-size: 12px; color: var(--gold); font-weight: 700; min-width: 96px; text-align: right; flex-shrink: 0; }
.space-del { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(255,80,80,0.35);
  background: rgba(255,80,80,0.12); color: rgba(255,160,160,0.9); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; transition: all 0.2s; font-weight: 700; }
.space-del:hover { background: rgba(255,80,80,0.28); }

/* Area quick buttons */
.area-quick { display: flex; gap: 3px; flex-shrink: 0; }
.area-quick-btn { width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--border);
  background: var(--glass); color: var(--cream); cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; font-weight: 700; }
.area-quick-btn:active { background: rgba(212,160,23,0.25); }

/* ── Add spaces ── */
.add-section { margin-top: 22px; }
.add-section-title { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 11px; font-weight: 600; }
.add-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.add-btn { background: var(--glass); border: 1px dashed rgba(255,255,255,0.25); border-radius: 8px;
  padding: 8px 13px; cursor: pointer; color: var(--muted); font-size: 12px; font-family: var(--font-body);
  transition: all 0.18s; white-space: nowrap; font-weight: 500; }
.add-btn:hover, .add-btn:active { background: var(--glass2); border-color: var(--gold); color: var(--gold); }
.custom-add { display: flex; gap: 8px; margin-top: 12px; }
.custom-input { flex: 1; background: var(--glass); border: 1px solid var(--border); border-radius: 8px;
  color: var(--cream); font-size: 13px; padding: 9px 12px; outline: none; font-family: var(--font-body); }
.custom-input:focus { border-color: var(--gold); }
.custom-confirm { background: var(--gold); border: none; border-radius: 8px; padding: 9px 17px; color: #000; font-weight: 700; cursor: pointer; font-size: 13px; }

.area-summary { margin-top: 14px; padding: 13px 17px; background: rgba(212,160,23,0.10);
  border: 1px solid rgba(212,160,23,0.25); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
.area-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.area-val { font-size: 17px; font-weight: 800; color: var(--gold); }

/* ── Global price multiplier ── */
.global-adj { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.global-adj-label { font-size: 12px; color: var(--muted); font-weight: 600; }

/* ── Quote ── */
.client-row { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.client-field { flex: 1; min-width: 180px; }
.client-label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 5px; letter-spacing: 0.5px; font-weight: 600; }
.client-input { width: 100%; background: var(--glass2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--cream); font-size: 14px; padding: 10px 13px; outline: none; font-family: var(--font-body); }
.client-input:focus { border-color: var(--gold); }

.quote-card { background: var(--glass); border: 1px solid rgba(212,160,23,0.35); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.quote-header-band { background: linear-gradient(90deg, var(--navy2), #0a1826); padding: 17px 20px;
  display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
.quote-htitle { font-family: var(--font-display); font-size: 19px; color: var(--gold); font-weight: 700; }
.quote-hmeta { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.75; }
.quote-hdate { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.6; }

.price-band { padding: 26px 20px; text-align: center; background: linear-gradient(135deg, rgba(26,58,92,0.5), rgba(212,160,23,0.10)); border-bottom: 1px solid var(--border); }
.price-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; font-weight: 600; }
.price-range { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
.price-low { font-size: 22px; font-weight: 400; color: rgba(240,244,248,0.85); }
.price-sep { font-size: 20px; color: var(--gold); }
.price-high { font-family: var(--font-display); font-size: 36px; font-weight: 700; color: var(--gold); }
.price-note { margin-top: 11px; font-size: 12px; color: rgba(255,184,0,0.8); font-weight: 500; }
.price-sqm { margin-top: 5px; font-size: 12px; color: var(--muted); }

/* Manual price override */
.manual-override { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 11px 17px;
  background: rgba(255,255,255,0.05); border-radius: 10px; flex-wrap: wrap; justify-content: center; }
.manual-override-label { font-size: 12px; color: var(--muted); font-weight: 600; }
.manual-discount { display: flex; gap: 6px; flex-wrap: wrap; }
.disc-btn { padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border); background: var(--glass);
  color: var(--muted); font-size: 11px; cursor: pointer; font-family: var(--font-body); transition: all 0.18s; font-weight: 600; }
.disc-btn.active { background: rgba(46,107,79,0.3); border-color: rgba(46,107,79,0.55); color: #8FD4A8; }
.disc-btn.disc-neg.active { background: rgba(180,60,60,0.25); border-color: rgba(180,60,60,0.45); color: rgba(255,160,160,1); }

.breakdown-wrap { padding: 17px 20px; }
.breakdown-title { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 13px; font-weight: 700; }
.b-row { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; flex-wrap: wrap; }
.b-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.b-label { font-size: 12px; color: rgba(240,244,248,0.85); flex: 1; min-width: 140px; font-weight: 500; }
.b-bar { flex: 2; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; min-width: 60px; overflow: hidden; }
.b-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
.b-pct { font-size: 11px; color: var(--muted); width: 32px; text-align: right; font-weight: 600; }
.b-val { font-size: 12px; font-weight: 700; color: var(--cream); min-width: 100px; text-align: right; }
.b-total { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 11px; margin-top: 7px; font-size: 14px; font-weight: 700; }

/* ── Table ── */
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 480px; }
th { background: rgba(26,58,92,0.75); color: rgba(255,255,255,0.95); padding: 9px 11px; text-align: left; font-weight: 700;
  border-bottom: 2px solid rgba(212,160,23,0.35); white-space: nowrap; font-size: 11px; }
td { padding: 9px 11px; border-bottom: 1px solid rgba(255,255,255,0.06); color: var(--cream); }
tr:last-child td { border-bottom: none; }

/* ── Payment ── */
.pay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.pay-card { background: var(--glass); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.pay-head { padding: 7px 13px; font-size: 12px; font-weight: 700; color: #fff; }
.pay-amount { padding: 11px 13px 3px; font-size: 16px; font-weight: 800; color: var(--gold); }
.pay-pct { font-size: 12px; color: var(--muted); font-weight: 500; }
.pay-trigger { padding: 0 13px 3px; font-size: 11px; color: var(--cream); font-weight: 500; }
.pay-trigger-en { padding: 0 13px 4px; font-size: 10px; color: var(--dim); }
.pay-products { padding: 0 13px 11px; font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.5; }

.disc { padding: 9px 13px; margin-bottom: 7px; font-size: 12px; color: rgba(255,255,255,0.7);
  line-height: 1.7; background: rgba(255,255,255,0.04); border-radius: 0 6px 6px 0; }

/* ── Bottom bar ── */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: rgba(13,31,53,0.96);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(212,160,23,0.3);
  padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 9px; justify-content: space-between; flex-wrap: wrap; }
.btn-back { background: var(--glass2); border: 1px solid var(--border); color: var(--cream); padding: 11px 16px;
  border-radius: 10px; font-size: 13px; cursor: pointer; font-family: var(--font-body); flex-shrink: 0; font-weight: 600; }
.btn-next { flex: 1; background: linear-gradient(135deg, var(--navy2), var(--gold)); border: none; color: #fff;
  padding: 13px 16px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s; min-width: 140px; }
.btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-print { flex: 1; background: linear-gradient(135deg, var(--green), var(--navy2)); border: none; color: #fff;
  padding: 13px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font-body); min-width: 100px; }
.btn-export { flex: 1; background: linear-gradient(135deg, #B85A00, var(--gold)); border: none; color: #fff;
  padding: 13px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: var(--font-body); min-width: 130px; }

let _saveTimer = null;
function saveState(immediate) {
  clearTimeout(_saveTimer);
  if (immediate) {
    try { localStorage.setItem('qvq_v3', JSON.stringify(state)); updateSaveBadge(true); } catch(e){}
    return;
  }
  updateSaveBadge(false);
  _saveTimer = setTimeout(() => {
    try { localStorage.setItem('qvq_v3', JSON.stringify(state)); updateSaveBadge(true); } catch(e){}
  }, 600);
}
function loadState() {
  try {
    const hash = location.hash.slice(1);
    if (hash && hash.startsWith('q=')) {
      const decoded = JSON.parse(decodeURIComponent(atob(hash.slice(2))));
      if (decoded && decoded.spaces) {
        state = { ...state, ...decoded };
        history.replaceState(null,'',location.pathname);
        return;
      }
    }

/* ============================================================================
   Calculations
============================================================================ */
function calcSpace(sp) {
  const area = parseFloat(sp.area) || 0;
  const sm = STYLES[state.style]?.mult || 1;
  const tm = TIERS[state.tier]?.mult || 1;
  const discMult = 1 + (state.discount || 0);
  const mat = area * sp.base * sm * tm * discMult;
  const log = mat * LOGISTICS_RATE;
  const oh  = mat * OVERHEAD;
  const con = mat * CONTINGENCY;
  return { area, mat, log, oh, con, total: mat+log+oh+con };
}
function calcTotals() {
  const rows = state.spaces.map(calcSpace).filter(r=>r.area>0);
  const totalArea = rows.reduce((a,r)=>a+r.area,0);
  const totalMat  = rows.reduce((a,r)=>a+r.mat,0);
  const totalLog  = rows.reduce((a,r)=>a+r.log,0);
  const totalOH   = rows.reduce((a,r)=>a+r.oh,0);
  const totalCon  = rows.reduce((a,r)=>a+r.con,0);
  const gross     = totalMat+totalLog+totalOH+totalCon;
  return { rows, totalArea, totalMat, totalLog, totalOH, totalCon, gross,
           low: gross*0.92, high: gross*1.18 };
}
function fmt(n)  { return 'QAR ' + Math.round(n).toLocaleString('en-US'); }
function pct(n)  { return (n*100).toFixed(0)+'%'; }
function uid()   { return 'sp_' + Math.random().toString(36).slice(2,8); }
function esc(s)  { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// FIX: Performance — light-touch input handler, no full re-render on every keystroke
function attachSpaceInputHandlers() {
  const list = document.getElementById('spaceList');
  if (!list) return;
  list.addEventListener('input', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.id) return;
    const sp = state.spaces.find(s => s.id === el.dataset.id);
    if (!sp) return;
    if (el.dataset.field === 'area') {
      sp.area = el.value;
      // Update visible cost inline without re-rendering whole page
      const row = el.closest('.space-row');
      if (row) {
        const calc = calcSpace(sp);
        const costEl = row.querySelector('.space-cost');
        if (costEl) {
          if (state.style && state.tier && calc.area > 0) {
            costEl.textContent = fmt(calc.total);
            costEl.style.color = 'var(--gold)';
            costEl.style.fontSize = '12px';
            row.classList.add('has-value');
          } else {
            costEl.textContent = sp.base + ' QAR/m²';
            costEl.style.color = 'var(--muted)';
            costEl.style.fontSize = '11px';
            row.classList.remove('has-value');
          }
        }
      }
    } else if (el.dataset.field === 'base') {
      sp.base = Math.max(50, parseFloat(el.value) || 50);
    }
    saveState(); // debounced
  });
  // On blur, do a full re-render to update the area summary banner
  list.addEventListener('blur', (e) => {
    if (e.target.classList.contains('space-input')) {
      renderAll();
    }
  }, true);
}

function attachClientHandlers() {
  ['clientNameInp','projectNameInp','projectAddrInp'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => {
      if (id==='clientNameInp')   state.clientName  = el.value;
      if (id==='projectNameInp')  state.projectName = el.value;
      if (id==='projectAddrInp')  state.projectAddr = el.value;
      saveState();
    });
  });
}

/* ============================================================================
   Print container (FIX 1: 卡顿) — 仅在按下打印按钮时构建
============================================================================ */
function buildPrintHTML() {
  // Returns the standalone quote HTML body (used for both print & export)
  const T2 = calcTotals();
  const sLabel = lang==='en' ? (STYLES[state.style]?.en||'—') : (STYLES[state.style]?.label||'—');
  const tLabel = lang==='en' ? (TIERS[state.tier]?.en||'—')   : (TIERS[state.tier]?.label||'—');
  const today  = new Date().toLocaleDateString(lang==='en'?'en-GB':'zh-CN');

  return generateQuoteDocumentHTML({
    state, totals: T2, sLabel, tLabel, today, lang
  });
}

function doPrint() {
  const pc = document.getElementById('printContainer');
  pc.innerHTML = buildPrintHTML();
  pc.style.display = 'block';
  setTimeout(() => {
    window.print();
    setTimeout(() => { pc.style.display = 'none'; pc.innerHTML = ''; }, 500);
  }, 100);
}

/* ============================================================================
   Main render
============================================================================ */
function renderMain() {
  const el = document.getElementById('mainContent');
  let html = '';
  switch(state.tab) {
    case 0: html = renderStyle(); break;
    case 1: html = renderTier(); break;
    case 2: html = renderSpaces(); break;
    case 3: html = renderQuote(); break;
  }
  el.innerHTML = html;

  // Attach handlers AFTER innerHTML
  if (state.tab === 2) attachSpaceInputHandlers();
  if (state.tab === 3) attachClientHandlers();
}

function renderBottom() {
  const el = document.getElementById('bottomBar');
  const tab = state.tab;
  const hasSpaces = state.spaces.some(s=>parseFloat(s.area)>0);
  const canNext = (tab===0&&state.style)||(tab===1&&state.tier)||(tab===2&&hasSpaces);

  if (tab === 3) {
    el.innerHTML = `
      <button class="btn-back" onclick="goTab(2)">${t('backBtn')}</button>
      <button class="btn-reset" onclick="resetQuote()">${t('newQuote')}</button>
      <button class="btn-export" onclick="exportStandaloneHTML()">${t('exportBtn')}</button>
      <button class="btn-print" onclick="doPrint()">${t('printBtn')}</button>`;
  } else {
    el.innerHTML = `
      ${tab>0?`<button class="btn-back" onclick="goTab(${tab-1})">${t('prevStep')}</button>`:'<div></div>'}
      <button class="btn-next" ${canNext?'':'disabled'} onclick="goTab(${tab+1})">
        ${tab===2?t('genQuote'):t('nextStep')}
      </button>`;
  }
}

function resetQuote() {
  if (!confirm(t('confirmReset'))) return;
  state = {
    tab: 0, style: null, tier: null,
    spaces: JSON.parse(JSON.stringify(DEFAULT_SPACES)),
    clientName: '', projectName: '', projectAddr: '',
    quoteRef: 'QQ-' + Date.now().toString(36).toUpperCase(),
    discount: 0,
  };
  renderAll();
}

/* ============================================================================
   PWA service worker
============================================================================ */
if ('serviceWorker' in navigator) {
  const swCode = `const CACHE='qvq-v3';self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll([self.location.pathname]))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

/* ============================================================================
   Init
============================================================================ */
loadState();
renderAll();
// 不再用 setInterval autosave — 改为输入时 debounced save
</script>
</body>
</html>
