<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qatar Quote System</title>

<style>
:root{
  --navy:#0D1F35;
  --gold:#B88600;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--navy);
  color:#fff;
}

main{
  padding:20px;
}

/* ===== UI ===== */
.card{
  border:1px solid #444;
  padding:16px;
  margin-bottom:16px;
  border-radius:8px;
}

/* ===== 按钮 ===== */
button{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* ===== PRINT 核心修复 ===== */
@media print{

  @page{
    size:A4;
    margin:12mm;
  }

  *{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    position:static !important;
    overflow:visible !important;
  }

  html,body{
    background:var(--navy) !important;
    height:auto !important;
  }

  main{
    padding:0 !important;
  }

  button{
    display:none !important;
  }

  .card{
    page-break-inside:avoid !important;
    break-inside:avoid !important;
  }
}
</style>
</head>

<body>

<main>

<div class="card">
  <h2>报价系统</h2>

  <label>客户姓名：</label>
  <input id="client" style="width:100%;margin-bottom:10px">

  <label>项目名称：</label>
  <input id="project" style="width:100%;margin-bottom:10px">

  <label>面积 m²：</label>
  <input id="area" type="number" style="width:100%;margin-bottom:10px">

  <label>单价 QAR/m²：</label>
  <input id="price" type="number" value="500" style="width:100%;margin-bottom:10px">

  <button onclick="calc()">计算</button>
</div>

<div class="card">
  <h3>结果</h3>
  <div id="result">-</div>
</div>

<div class="card">
  <button onclick="save()">保存</button>
  <button onclick="exportData()">导出</button>
  <input type="file" onchange="importData(this)">
  <button onclick="window.print()">打印</button>
</div>

</main>

<script>

let state={};

/* ===== 计算 ===== */
function calc(){
  const area=+document.getElementById('area').value||0;
  const price=+document.getElementById('price').value||0;

  const total=area*price;

  document.getElementById('result').innerHTML=
    "总价: QAR "+total.toLocaleString();

  state={
    client:document.getElementById('client').value,
    project:document.getElementById('project').value,
    area,
    price,
    total
  };
}

/* ===== 保存 ===== */
function save(){
  localStorage.setItem("quote",JSON.stringify(state));
  alert("已保存");
}

/* ===== 加载 ===== */
(function(){
  const data=localStorage.getItem("quote");
  if(data){
    state=JSON.parse(data);
    document.getElementById('client').value=state.client||"";
    document.getElementById('project').value=state.project||"";
    document.getElementById('area').value=state.area||"";
    document.getElementById('price').value=state.price||"";
    document.getElementById('result').innerHTML=
      "总价: QAR "+(state.total||0).toLocaleString();
  }
})();

/* ===== 导出（解决iPhone→Mac空文件）===== */
function exportData(){
  const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='quote.json';
  a.click();
}

/* ===== 导入 ===== */
function importData(input){
  const file=input.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=e=>{
    state=JSON.parse(e.target.result);
    location.reload();
  };
  reader.readAsText(file);
}

</script>

</body>
</html>
