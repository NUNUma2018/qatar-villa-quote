<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Qatar Quote"/>
<meta name="theme-color" content="#0D1F35"/>
<title>◈ Qatar Villa Quote v2 (Fixed)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy: #0D1F35;
  --navy2: #1A3A5C;
  --gold: #B88600;
  --gold2: #D4A017;
  --green: #2E6B4F;
  --cream: #E8EDF2;
  --muted: rgba(232,237,242,0.5);
  --dim: rgba(232,237,242,0.2);
  --glass: rgba(255,255,255,0.05);
  --glass2: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.09);
  --radius: 14px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; }
body { font-family: var(--font-body); background: var(--navy); color: var(--cream); min-height: 100vh; min-height: 100dvh; }

/* 基础背景层 */
.bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 50% at 15% 15%, rgba(26,58,92,0.7) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 85%, rgba(184,134,0,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(46,107,79,0.08) 0%, transparent 70%); }
.bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px; }

/* ── UI 组件 (此处省略重复的 CSS 以节省篇幅，重点在下方的 PRINT 部分) ── */
header { position: sticky; top: 0; z-index: 200; background: rgba(13,31,53,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(184,134,0,0.25); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
.logo-title { font-family: var(--font-display); font-size: 12px; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; }
.tab-nav { position: sticky; top: 56px; z-index: 190; background: rgba(13,31,53,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; }
.tab-btn { flex: 1; min-width: 76px; padding: 8px 6px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 10px; display: flex; flex-direction: column; align-items: center; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 24px 16px 130px; }
.card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.card-head { padding: 12px 18px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.03); }
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: rgba(13,31,53,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(184,134,0,0.25); padding: 12px 16px; display: flex; gap: 10px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }

/* 报价单内部样式 */
.quote-card { background: var(--glass); border: 1px solid rgba(184,134,0,0.3); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.quote-header-band { background: linear-gradient(90deg, var(--navy2), #0a1826); padding: 16px 20px; color: white; display: flex; justify-content: space-between; }
.price-band { padding: 24px 20px; text-align: center; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); }
.price-high { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--gold); }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th { background: rgba(26,58,92,0.7); color: var(--muted); padding: 8px; text-align: left; border-bottom: 2px solid var(--gold); }
td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.04); color: var(--cream); }
.pay-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.pay-card { background: var(--glass); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }

/* ── 重点修复：打印样式 ── */
@media print {
  /* 1. 强制保留背景颜色和图片 */
  * { 
    -webkit-print-color-adjust: exact !important; 
    print-color-adjust: exact !important; 
    color-adjust: exact !important;
  }

  @page { size: A4 portrait; margin: 10mm; }

  /* 2. 隐藏不需要的 UI 元素 */
  header, .tab-nav, .bottom-bar, .add-section, .space-del,
  .price-edit-panel, .manual-override, .lang-toggle, .save-badge,
  .bg-layer, .bg-grid, .area-quick, .base-price-wrap { display: none !important; }

  /* 3. 修复内容截断问题：强制所有容器解除高度限制 */
  html, body { 
    height: auto !important; 
    overflow: visible !important; 
    background: var(--navy) !important; /* 保留深色背景，如需变白改为 #fff */
    color: var(--cream) !important;
  }
  
  main { 
    padding: 0 !important; 
    margin: 0 !important; 
    max-width: 100% !important; 
    overflow: visible !important;
    position: static !important;
  }

  .page { 
    position: static !important;
    display: block !important;
    overflow: visible !important;
  }

  /* 4. 优化卡片分页 */
  .quote-card, .card { 
    page-break-inside: avoid; 
    break-inside: avoid; 
    border: 1px solid rgba(184,134,0,0.3) !important;
    background: rgba(255,255,255,0.05) !important;
    margin-bottom: 20px !important;
    position: static !important;
  }

  .pay-grid { 
    display: block !important; /* 打印时 Grid 有时会有 Bug，改为 Block */
  }
  .pay-card { 
    margin-bottom: 10px !important;
    page-break-inside: avoid;
  }
}

/* 按钮样式 */
.btn-next, .btn-print { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; }
.btn-print { background: var(--green); color: white; }
.btn-next { background: var(--gold); color: black; }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="bg-grid"></div>

<header>
  <div class="logo">
    <span class="logo-gem">◈</span>
    <div class="logo-text">
      <div class="logo-title">QATAR VILLA QUOTE</div>
    </div>
  </div>
  <div class="save-badge" id="saveBadge">● 已保存</div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="goTab(0)">风格 Style</button>
  <button class="tab-btn" onclick="goTab(1)">材料 Grade</button>
  <button class="tab-btn" onclick="goTab(2)">面积 Area</button>
  <button class="tab-btn" onclick="goTab(3)">报价单 Quote</button>
</nav>

<main id="mainContent"></main>
<div class="bottom-bar" id="bottomBar"></div>

<script>
// ─── 核心逻辑 ───
let state = {
  tab: 0,
  style: 'modern',
  tier: 'premium',
  spaces: [
    { id:'living', icon:'🛋️', name:'客厅', nameEn:'Living', base:420, area:'' },
    { id:'kitchen', icon:'🍳', name:'厨房', nameEn:'Kitchen', base:680, area:'' }
  ],
  clientName: '',
  projectName: '',
  discount: 0
};

// ─── 重点修复：数据编码与 URL 同步 (解决跨设备数据丢失) ───
function syncToURL() {
  const json = JSON.stringify(state);
  // 使用 Base64 编码，防止特殊字符破坏 URL
  const encoded = btoa(encodeURIComponent(json));
  window.history.replaceState(null, '', '#' + encoded);
}

function loadFromURL() {
  const hash = window.location.hash.substring(1);
  if (hash) {
    try {
      const decoded = decodeURIComponent(atob(hash));
      const parsed = JSON.parse(decoded);
      state = { ...state, ...parsed };
      return true;
    } catch (e) {
      console.error("URL 数据解析失败", e);
    }
  }
  return false;
}

// ─── 状态管理 ───
function saveState() {
  localStorage.setItem('qvq_v2_fixed', JSON.stringify(state));
  syncToURL(); // 每次保存都更新 URL，这样点击 Safari 的“分享”时，链接里就带着数据了
  document.getElementById('saveBadge').style.color = '#7EC8A0';
}

function goTab(t) { 
  state.tab = t; 
  render(); 
}

function render() {
  const main = document.getElementById('mainContent');
  const bottom = document.getElementById('bottomBar');
  
  // 简易渲染逻辑 (根据你的实际代码补充各个 Tab 内容)
  if (state.tab === 3) {
    main.innerHTML = `
      <div class="quote-card">
        <div class="quote-header-band">
          <h3>${state.projectName || 'New Project'}</h3>
          <span>Date: ${new Date().toLocaleDateString()}</span>
        </div>
        <div class="price-band">
          <div class="price-high">QAR ${calcTotal().toLocaleString()}</div>
          <p>Estimate Quote (Materials TBC ±15%)</p>
        </div>
      </div>
      <div class="card">
        <div class="card-head">项目明细 Details</div>
        <table style="padding:10px">
          ${state.spaces.map(s => `<tr><td>${s.name}</td><td>${s.area || 0} m²</td></tr>`).join('')}
        </table>
      </div>
    `;
    bottom.innerHTML = `
      <button class="btn-next" style="background:#444;color:white" onclick="goTab(2)">← 返回</button>
      <button class="btn-print" onclick="window.print()">🖨️ 打印报价单 / Print</button>
    `;
  } else {
    main.innerHTML = `<div class="card"><div class="card-head">Step ${state.tab + 1}</div><div style="padding:40px;text-align:center">请在面积页输入数值</div></div>`;
    bottom.innerHTML = `<button class="btn-next" onclick="goTab(${state.tab + 1})">下一步 Next →</button>`;
  }
  saveState();
}

function calcTotal() {
  return state.spaces.reduce((sum, s) => sum + (parseFloat(s.area || 0) * s.base), 0);
}

// ─── 初始化 ───
window.onload = () => {
  if (!loadFromURL()) {
    const saved = localStorage.getItem('qvq_v2_fixed');
    if (saved) state = JSON.parse(saved);
  }
  render();
};
</script>
</body>
</html>
