<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Qatar Quote"/>
<meta name="theme-color" content="#0D1F35"/>
<title>◈ Qatar Villa Quote v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy: #0D1F35;
  --navy2: #1A3A5C;
  --gold: #B88600;
  --gold2: #D4A017;
  --green: #2E6B4F;
  --cream: #E8EDF2;
  --muted: rgba(232,237,242,0.5);
  --dim: rgba(232,237,242,0.2);
  --glass: rgba(255,255,255,0.05);
  --glass2: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.09);
  --radius: 14px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow-x: hidden; }
body { font-family: var(--font-body); background: var(--navy); color: var(--cream); min-height: 100vh; }

/* 背景层 */
.bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 70% 50% at 15% 15%, rgba(26,58,92,0.7) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 85%, rgba(184,134,0,0.18) 0%, transparent 60%); }
.bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 44px 44px; }

/* ── 打印样式优化 ── */
@media print {
  /* 强制打印背景颜色和图片 */
  * { 
    -webkit-print-color-adjust: exact !important; 
    print-color-adjust: exact !important; 
    color-adjust: exact !important;
  }
  
  header, .tab-nav, .bottom-bar, .add-section, .space-del, .price-edit-panel, .manual-override, .bg-grid, .bg-layer { 
    display: none !important; 
  }

  body { 
    background: #FFFFFF !important; 
    color: #000000 !important; 
    margin: 0; 
    padding: 0;
  }

  main { 
    padding: 0 !important; 
    max-width: 100% !important; 
  }

  /* 修复报价单顶部蓝色块[cite: 1] */
  .quote-card { 
    border: 1px solid #ddd !important;
    background: #fff !important;
    box-shadow: none !important;
    page-break-inside: avoid;
  }

  .quote-header-band { 
    background: #0D1F35 !important; /* 强制深蓝色 */
    color: #FFFFFF !important;
    padding: 20px !important;
    -webkit-print-color-adjust: exact;
  }

  .quote-htitle { color: #B88600 !important; }
  .price-high { color: #B88600 !important; font-size: 28pt !important; }
  
  .card { 
    border: 1px solid #eee !important; 
    page-break-inside: avoid; 
    margin-top: 20px;
  }

  /* 修复表格文字颜色 */
  td, th { color: #000 !important; border-bottom: 1px solid #ddd !important; }
  th { background: #f5f5f5 !important; }

  /* 支付卡片打印适配 */
  .pay-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  .pay-card { border: 1px solid #ccc !important; }
  .pay-head { background: #1A3A5C !important; color: white !important; }
}

/* ── UI 样式 (保持原逻辑) ── */
header { position: sticky; top: 0; z-index: 200; background: rgba(13,31,53,0.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(184,134,0,0.25); padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-gem { font-size: 20px; color: var(--gold); }
.logo-title { font-family: var(--font-display); font-size: 12px; color: var(--gold); letter-spacing: 1.5px; font-weight: 700; }
.save-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px;
  background: rgba(46,107,79,0.25); border: 1px solid rgba(46,107,79,0.5); color: #7EC8A0; }

.tab-nav { position: sticky; top: 56px; z-index: 190; background: rgba(13,31,53,0.92);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; }
.tab-btn { flex: 1; padding: 8px 6px; background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 10px; display: flex; flex-direction: column; align-items: center; border-bottom: 2px solid transparent; }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 20px 16px 120px; }
.card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
.quote-card { background: var(--glass); border: 1px solid rgba(184,134,0,0.3); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }

/* 后续 JavaScript 逻辑和 T 字典保持不变... */
</style>
</head>
